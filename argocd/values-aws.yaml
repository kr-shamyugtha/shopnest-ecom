# AWS counterpart to argocd/values.yaml. Same Application/AppProject shape;
# what differs is the repo it tracks (GitHub, not Azure Repos) and the
# value files it layers (values-aws.yaml + environments/aws/<env>.yaml).
#
# argocd/install-values.yaml is cloud-neutral and used unchanged for the
# Argo CD install itself on both clouds.

applications:
  shopnest:
    namespace: argocd
    additionalLabels: {}
    additionalAnnotations: {}
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: shopnest
    sources:
      # The GitHub repo the AWS pipeline pushes its GitOps commits to. It is
      # public, so unlike the Azure Repos setup no repo credential is needed;
      # if it is ever made private, add one in terraform/aws/modules/argocd.
      - repoURL: https://github.com/kr-shamyugtha/shopnest-ecom.git
        path: helm/shopnest
        targetRevision: HEAD
        helm:
          releaseName: shopnest
          valueFiles:
            - values-aws.yaml
            - environments/aws/dev.yaml
    destination:
      server: https://kubernetes.default.svc
      # Must match where the app actually runs — every other piece (CI, the
      # backend's Pod Identity association, the NetworkPolicies) already
      # assumes the "shopnest" namespace.
      namespace: shopnest
    syncPolicy:
      automated:
        selfHeal: true
        prune: true
      # Retry covers the fresh-cluster race where the app syncs before the
      # monitoring stack has installed the ServiceMonitor CRD.
      retry:
        limit: 5
        backoff:
          duration: 30s
          factor: 2
          maxDuration: 5m
      syncOptions:
        - CreateNamespace=true

projects:
  shopnest:
    namespace: argocd
    additionalLabels: {}
    additionalAnnotations: {}
    permitOnlyProjectScopedClusters: false
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    description: ShopNest application delivery
    sourceRepos:
      - https://github.com/kr-shamyugtha/shopnest-ecom.git
    destinations:
      - namespace: shopnest
        server: https://kubernetes.default.svc
    # Cluster-scoped resources denied by default except Namespace itself —
    # needed because syncPolicy.syncOptions has CreateNamespace=true, and
    # that goes through this same project permission check. Namespace-scoped
    # kinds explicitly limited to what the app actually needs — notably
    # excludes Role/RoleBinding, so a compromised or mis-templated chart
    # change can never grant itself permissions via a synced manifest.
    clusterResourceWhitelist:
      - group: ""
        kind: Namespace
    namespaceResourceWhitelist:
      - group: "apps"
        kind: Deployment
      - group: ""
        kind: Service
      - group: ""
        kind: ServiceAccount
      - group: ""
        kind: ConfigMap
      - group: "autoscaling"
        kind: HorizontalPodAutoscaler
      - group: "policy"
        kind: PodDisruptionBudget
      - group: "networking.k8s.io"
        kind: NetworkPolicy
      - group: "networking.k8s.io"
        kind: Ingress
      - group: "secrets-store.csi.x-k8s.io"
        kind: SecretProviderClass
      # Same as the Azure project: without it the Application fails with
      # "resource monitoring.coreos.com:ServiceMonitor is not permitted in
      # project shopnest" and the backend is never scraped.
      - group: "monitoring.coreos.com"
        kind: ServiceMonitor
