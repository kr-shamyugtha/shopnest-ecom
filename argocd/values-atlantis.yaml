applications:
  atlantis:
    namespace: argocd
    additionalLabels: {}
    additionalAnnotations: {}
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: atlantis
    sources:
      - chart: atlantis
        repoURL: https://runatlantis.github.io/helm-charts
        targetRevision: 6.16.0
        helm:
          releaseName: atlantis
          values: |
            replicaCount: 1

            # Federates this pod to shopnest-dev-atlantis-identity (see
            # terraform/azure/modules/atlantis-identity) — no static Azure
            # credential stored anywhere, a short-lived token is exchanged
            # for the pod's own Kubernetes-issued identity at runtime. The
            # client-id here is that identity's client_id output, not a
            # secret — it identifies the identity but grants nothing
            # without a token the cluster signs for this exact ServiceAccount.
            podTemplate:
              labels:
                azure.workload.identity/use: "true"

            serviceAccount:
              annotations:
                azure.workload.identity/client-id: "4c0f5102-fd6f-4d07-bccd-9060974dca42"

            # The workload-identity webhook injects AZURE_* env vars, which
            # app-level SDKs (like the backend's) read automatically — but
            # Terraform's azurerm provider has its own auth resolution and
            # specifically needs these ARM_*-prefixed ones instead. Per
            # HashiCorp's AKS Workload Identity guide: ARM_USE_CLI must be
            # false so it doesn't try (and fail) to shell out to az cli
            # first. Identifiers, not secrets — safe here same as
            # backend_identity_client_id elsewhere in this repo.
            environment:
              ARM_USE_AKS_WORKLOAD_IDENTITY: "true"
              ARM_USE_CLI: "false"
              ARM_SUBSCRIPTION_ID: "b68fc861-1d2b-40c3-a317-f09c80a001e6"
              ARM_CLIENT_ID: "4c0f5102-fd6f-4d07-bccd-9060974dca42"
              ARM_TENANT_ID: "1734f897-f9d3-41eb-a30c-60d092d8a5d8"

            # This cluster is already at ~90% CPU *requests* on its tighter
            # node (2-node D2s_v7, no room to add a 3rd) — kept as small as
            # the other lightweight components here (prometheus-operator,
            # kube-state-metrics). Bump if plans start OOMKilling on larger
            # Terragrunt units.
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 300m
                memory: 512Mi

            atlantisUrl: https://atlantis.20.79.85.142.nip.io

            # Without this, atlantis.yaml's custom `terragrunt` workflow and
            # per-project apply_requirements would be silently rejected — a
            # deliberate Atlantis security default, since letting any repo
            # define its own shell steps is dangerous unless explicitly
            # opted into. Scoped to just this one repo, not every repo
            # Atlantis could ever see.
            repoConfig: |
              ---
              repos:
              - id: "dev.azure.com/kavitography/shopnest-ado/shopnest-ado"
                allow_custom_workflows: true
                allowed_overrides: ["apply_requirements", "workflow"]

            # Scoped to exactly this one repo, in both the current and
            # legacy Azure DevOps hostname forms — never a wildcard across
            # the whole org.
            orgAllowlist: "dev.azure.com/kavitography/shopnest-ado/shopnest-ado,kavitography.visualstudio.com/kavitography/shopnest-ado/shopnest-ado"

            # Credentials live in the atlantis-vcs Secret, created out of
            # band the same way as grafana-admin-credentials and
            # shopnest-teams-webhook — never committed here.
            #   kubectl create secret generic atlantis-vcs -n atlantis \
            #     --from-literal=azuredevops_token='<PAT>' \
            #     --from-literal=azuredevops_webhook_password='<webhook secret>'
            vcsSecretName: atlantis-vcs
            azuredevops:
              user: kavitography@gmail.com
              # Not a real account — just a shared label both sides (this
              # config and the Azure DevOps Service Hook, set up later)
              # agree on for the Basic Auth pair guarding the webhook.
              webhookUser: atlantis

            # This repo is Terragrunt, not plain Terraform — Atlantis's
            # native workflow only knows how to run `terraform` directly, so
            # every project in atlantis.yaml needs a custom `terragrunt`
            # workflow instead (added when atlantis.yaml itself is added).
            # The binary isn't in the upstream image, so it's fetched here
            # and handed to the main container over a shared emptyDir,
            # rather than maintaining a custom Atlantis image just for this
            # one binary. Pinned to match the version already used
            # everywhere else in this project.
            initContainers:
              - name: install-terragrunt
                image: alpine:3.20
                command: ["sh", "-c"]
                # wget (busybox, bundled) rather than curl — apk add fails
                # here with "Permission denied": this chart runs every
                # container as non-root, and apk needs root to touch its
                # package database.
                args:
                  - |
                    set -e
                    wget -qO /shared/terragrunt \
                      https://github.com/gruntwork-io/terragrunt/releases/download/v1.1.2/terragrunt_linux_amd64
                    chmod +x /shared/terragrunt
                volumeMounts:
                  - name: terragrunt-bin
                    mountPath: /shared

            extraVolumes:
              - name: terragrunt-bin
                emptyDir: {}

            extraVolumeMounts:
              - name: terragrunt-bin
                mountPath: /usr/local/bin/terragrunt
                subPath: terragrunt

            ingress:
              enabled: true
              ingressClassName: nginx
              host: atlantis.20.79.85.142.nip.io
              # Chart defaults to path: /* (its own values.yaml says
              # "Use / for nginx" right next to that field) — nginx doesn't
              # treat "/*" as a wildcard without a separate use-regex
              # annotation, so every request fell through to the default
              # 404 backend until this was set explicitly.
              path: /
              pathType: Prefix
              annotations:
                cert-manager.io/cluster-issuer: letsencrypt-prod
              tls:
                - secretName: atlantis-tls
                  hosts:
                    - atlantis.20.79.85.142.nip.io

    destination:
      server: https://kubernetes.default.svc
      namespace: atlantis
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

projects:
  atlantis:
    namespace: argocd
    additionalLabels: {}
    additionalAnnotations: {}
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    permitOnlyProjectScopedClusters: false
    description: Atlantis Terraform/Terragrunt automation
    sourceRepos:
      - https://runatlantis.github.io/helm-charts
    destinations:
      - namespace: atlantis
        server: https://kubernetes.default.svc
    clusterResourceWhitelist:
      - group: ""
        kind: Namespace
