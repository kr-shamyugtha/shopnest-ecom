                      }


            prometheus:
              enabled: true
              prometheusSpec:
                # THE MOST IMPORTANT SETTING IN THIS FILE.
                # By default this chart's Prometheus only watches
                # ServiceMonitors carrying ITS OWN Helm release label
                # (release=monitoring). Everything created by a different
                # release - the Loki chart, the Alloy chart, and the
                # ShopNest app chart - is then silently ignored: the
                # ServiceMonitor exists, looks healthy, and is never
                # scraped. Setting these to false makes Prometheus watch
                # every ServiceMonitor/PodMonitor/PrometheusRule in every
                # namespace regardless of who created it.
                serviceMonitorSelectorNilUsesHelmValues: false
                serviceMonitorNamespaceSelector: {}
                podMonitorSelectorNilUsesHelmValues: false
                podMonitorNamespaceSelector: {}
                ruleSelectorNilUsesHelmValues: false
                ruleNamespaceSelector: {}

                # Previously unset, which made this pod BestEffort QoS -
                # the first thing evicted or OOM-killed under node
                # pressure. Losing Prometheus is losing the ability to
                # see why anything else broke, so it gets a real
                # reservation. Sized for a 2-node D2s_v7 cluster with
                # ~1.2 vCPU spare, not a production fleet.
                resources:
                  requests:
                    cpu: 150m
                    memory: 512Mi
                  limits:
                    cpu: 750m
                    memory: 1Gi

                retention: 7d
                storageSpec:
                  volumeClaimTemplate:
                    spec:
                      accessModes:
                        - ReadWriteOnce
                      resources:
                        requests:
                          storage: 10Gi

            alertmanager:
              enabled: true
              alertmanagerSpec:
                resources:
                  requests:
                    cpu: 25m
                    memory: 100Mi
                  limits:
                    cpu: 100m
                    memory: 200Mi
                storage:
                  volumeClaimTemplate:
                    spec:
                      accessModes:
                        - ReadWriteOnce
                      resources:
                        requests:
                          storage: 2Gi
              # NOTE: put the real Slack webhook URL in a Secret instead of
              # committing it in plaintext here.
              config:
                global: {}
                route:
                  receiver: "shopnest-slack"
                  group_by: ["alertname", "severity"]
                  group_wait: 30s
                  group_interval: 5m
                  repeat_interval: 3h
                  routes:
                    - matchers:
                        - severity = critical
                      receiver: "shopnest-slack"
                      repeat_interval: 1h
                receivers:
                  - name: "shopnest-slack"
                    slack_configs:
                      - api_url: "https://hooks.slack.com/services/REPLACE/WITH/YOUR-WEBHOOK"
                        channel: "#shopnest-alerts"
                        send_resolved: true
                        title: '{{ .CommonAnnotations.summary }}'
                        text: '{{ .CommonAnnotations.description }}'

            nodeExporter:
              enabled: true

            kubeStateMetrics:
              enabled: true

            # Subchart-level resources. nodeExporter/kubeStateMetrics above
            # are the enable flags; the resource blocks belong to the
            # subcharts themselves, which is why they are keyed by the
            # subchart name rather than nested under those toggles.
            prometheus-node-exporter:
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi

            kube-state-metrics:
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi

            prometheusOperator:
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi

            # ============================================================
            # ShopNest alert rules.
            #
            # Deliberately few, and each one gated so it does not fire on
            # normal noise - a single pod restart during a rollout, or one
            # failed request, should not page anyone. These are the first
            # rules in this cluster that are about ShopNest rather than
            # about Kubernetes itself; every one of the 35 rules shipped by
            # this chart describes the platform, not the application.
            #
            # BackendDown and PodCrashLooping read kube-state-metrics, which
            # is already scraped, so they work immediately. The 5xx and
            # latency rules read the application's own metrics and stay
            # silent until the backend ServiceMonitor is syncing.
            # ============================================================
            additionalPrometheusRulesMap:
              shopnest-rules:
                groups:
                  - name: shopnest.availability
                    rules:
                      - alert: ShopNestBackendDown
                        expr: kube_deployment_status_replicas_available{namespace="shopnest", deployment="shopnest-backend"} < 1
                        for: 2m
                        labels:
                          severity: critical
                        annotations:
                          summary: "ShopNest backend has no available replicas"
                          description: >-
                            The backend Deployment has had zero available
                            replicas for 2 minutes. The API is down. Check
                            `kubectl -n shopnest get pods,events`.

                      - alert: ShopNestFrontendDown
                        expr: kube_deployment_status_replicas_available{namespace="shopnest", deployment="shopnest-frontend"} < 1
                        for: 2m
                        labels:
                          severity: critical
                        annotations:
                          summary: "ShopNest frontend has no available replicas"
                          description: >-
                            The frontend Deployment has had zero available
                            replicas for 2 minutes. The site is unreachable.

                      - alert: ShopNestPodCrashLooping
                        expr: increase(kube_pod_container_status_restarts_total{namespace="shopnest"}[15m]) > 3
                        for: 5m
                        labels:
                          severity: critical
                        annotations:
                          summary: "{{ $labels.pod }} is crash looping"
                          description: >-
                            {{ $labels.container }} in {{ $labels.pod }} has
                            restarted {{ $value | printf "%.0f" }} times in 15
                            minutes. Gated at >3 rather than >0 so a single
                            expected restart during a rollout does not page.

                  - name: shopnest.golden-signals
                    rules:
                      - alert: ShopNestHigh5xxRate
                        expr: >-
                          100 * sum(rate(shopnest_http_requests_total{status_code=~"5.."}[5m]))
                          / clamp_min(sum(rate(shopnest_http_requests_total[5m])), 1e-9) > 5
                        for: 5m
                        labels:
                          severity: warning
                        annotations:
                          summary: "ShopNest backend returning over 5% 5xx"
                          description: >-
                            5xx rate has been above 5% for 5 minutes
                            ({{ $value | printf "%.1f" }}% now). clamp_min keeps
                            the expression from dividing by zero at idle.

                      - alert: ShopNestHighLatencyP95
                        expr: >-
                          histogram_quantile(0.95,
                            sum(rate(shopnest_http_request_duration_seconds_bucket[5m])) by (le)) > 1
                        for: 5m
                        labels:
                          severity: warning
                        annotations:
                          summary: "ShopNest p95 latency above 1s"
                          description: >-
                            p95 request latency has been above 1 second for 5
                            minutes ({{ $value | printf "%.2f" }}s now). A
                            starting threshold for a dev-sized cluster, to be
                            tuned once real traffic patterns are known.

                  - name: shopnest.business
                    rules:
                      - alert: ShopNestPaymentVerificationFailing
                        expr: >-
                          sum(rate(shopnest_payment_verification_failures_total[10m]))
                          > sum(rate(shopnest_payment_verification_success_total[10m]))
                        for: 10m
                        labels:
                          severity: warning
                        annotations:
                          summary: "ShopNest payment verification failing more than succeeding"
                          description: >-
                            Failed payment verifications have outnumbered
                            successful ones for 10 minutes. Likely a Razorpay
                            signature/secret problem rather than a pod problem.

      - chart: loki
        repoURL: https://grafana.github.io/helm-charts
        targetRevision: 6.52.0
        helm:
          releaseName: loki
          values: |
            deploymentMode: SingleBinary

            loki:
              auth_enabled: false
              commonConfig:
                replication_factor: 1
              storage:
                type: filesystem
              schemaConfig:
                configs:
                  - from: "2024-01-01"
                    store: tsdb
                    object_store: filesystem
                    schema: v13
                    index:
                      prefix: loki_index_
                      period: 24h

            singleBinary:
              replicas: 1
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              persistence:
                enabled: true
                size: 10Gi

            chunksCache:
              enabled: false

            resultsCache:
              enabled: false

            backend:
              replicas: 0
            read:
              replicas: 0
            write:
              replicas: 0

            gateway:
              enabled: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi

            monitoring:
              serviceMonitor:
                enabled: true
              selfMonitoring:
                enabled: false

            # lokiCanary moved OUT of `monitoring:` - it is a top-level key in
            # loki chart 6.52.0 (values.yaml line 780) and defaults to true.
            # Nested under monitoring it was silently ignored, which is why two
            # loki-canary pods have been running on a 2-node cluster that has
            # no use for them.
            lokiCanary:
              enabled: false

            test:
              enabled: false

      - chart: alloy
        repoURL: https://grafana.github.io/helm-charts
        targetRevision: 1.11.1
        helm:
          releaseName: alloy
          values: |
            alloy:
              configMap:
                content: |-
                  discovery.kubernetes "pods" {
                    role = "pod"
                  }

                  discovery.relabel "pods" {
                    targets = discovery.kubernetes.pods.targets

                    rule {
                      source_labels = ["__meta_kubernetes_namespace"]
                      target_label  = "namespace"
                    }

                    rule {
                      source_labels = ["__meta_kubernetes_pod_name"]
                      target_label  = "pod"
                    }

                    rule {
                      source_labels = ["__meta_kubernetes_pod_container_name"]
                      target_label  = "container"
                    }
                  }

                  loki.source.kubernetes "pods" {
                    targets    = discovery.relabel.pods.output
                    forward_to = [loki.write.default.receiver]
                  }

                  loki.write "default" {
                    endpoint {
                      url = "http://loki-gateway/loki/api/v1/push"
                    }
                  }

              # NOTE the nesting: this chart reads container resources from
              # alloy.resources, NOT a top-level `resources:` key. Placed at
              # the top level it is silently ignored - the chart renders
              # fine, the DaemonSet comes up, and the containers simply have
              # no requests. Verified against `helm template grafana/alloy`
              # before committing.
              resources:
                requests:
                  cpu: 30m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi

            controller:
              type: daemonset

            serviceMonitor:
              enabled: true

    destination:
      server: https://kubernetes.default.svc
      namespace: monitoring
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

projects:
  monitoring:
    namespace: argocd
    additionalLabels: {}
    additionalAnnotations: {}
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    permitOnlyProjectScopedClusters: false
    description: ShopNest monitoring stack
    sourceRepos:
      - https://prometheus-community.github.io/helm-charts
      - https://grafana.github.io/helm-charts
    destinations:
      - namespace: "*"
        server: https://kubernetes.default.svc
    clusterResourceWhitelist:
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
      - group: rbac.authorization.k8s.io
        kind: ClusterRole
      - group: rbac.authorization.k8s.io
        kind: ClusterRoleBinding
      - group: admissionregistration.k8s.io
        kind: MutatingWebhookConfiguration
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
      - group: ""
        kind: Namespace
