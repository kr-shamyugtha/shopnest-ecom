applications:
  monitoring:
    namespace: argocd
    additionalLabels: {}
    additionalAnnotations: {}
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: monitoring
    sources:
      - chart: kube-prometheus-stack
        repoURL: https://prometheus-community.github.io/helm-charts
        targetRevision: 87.21.0
        helm:
          releaseName: monitoring
          values: |
            grafana:
              enabled: true
              deploymentStrategy:
                type: Recreate
              persistence:
                enabled: true
                type: pvc
                size: 5Gi
              # Sized from MEASURED usage, not guessed. The first attempt at
              # this (limit 256Mi) OOMKilled Grafana twice - exit 137 - because
              # steady-state sits at ~190Mi and rendering a dashboard spikes
              # well past that. Grafana loads all 30 provisioned dashboards
              # into memory, so it is the heaviest thing in this namespace
              # despite looking like the lightest.
              #
              # Observed: cpu 129m, memory 189Mi. Request now covers the
              # steady state; the limit leaves room for render spikes rather
              # than sitting on top of them.
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              additionalDataSources:
                - name: Loki
                  type: loki
                  access: proxy
                  url: http://loki-gateway.monitoring.svc.cluster.local
                  isDefault: false

              # ------------------------------------------------------
              # ShopNest dashboard, provisioned as a file through Grafana's
              # dashboardProviders rather than through the chart's
              # extraManifests.
              #
              # extraManifests looks like the obvious place, but it renders
              # every manifest through Helm's `tpl`. Grafana's legend syntax
              # is {{label}}, which Helm then tries to evaluate as a function
              # call and the whole sync dies with
              #   function "route" not defined
              # This path embeds the JSON verbatim - verified by rendering
              # the chart locally - so Grafana's braces survive intact.
              #
              # Every query uses only metrics backend/metrics/metrics.js
              # actually exports. Denominators are wrapped in
              # clamp_min(..., 1e-9) so the percentage panels read 0 at idle
              # instead of NaN.
              # ------------------------------------------------------
              dashboardProviders:
                dashboardproviders.yaml:
                  apiVersion: 1
                  providers:
                    - name: shopnest
                      orgId: 1
                      folder: ShopNest
                      type: file
                      disableDeletion: false
                      editable: true
                      options:
                        path: /var/lib/grafana/dashboards/shopnest
              dashboards:
                shopnest:
                  shopnest-red:
                    json: |
                      {
                        "title": "ShopNest \u2014 RED & Business",
                        "uid": "shopnest-red",
                        "tags": [
                          "shopnest"
                        ],
                        "timezone": "browser",
                        "schemaVersion": 39,
                        "refresh": "30s",
                        "time": {
                          "from": "now-1h",
                          "to": "now"
                        },
                        "templating": {
                          "list": [
                            {
                              "name": "DS_PROMETHEUS",
                              "type": "datasource",
                              "query": "prometheus",
                              "current": {
                                "text": "Prometheus",
                                "value": "Prometheus"
                              },
                              "hide": 0
                            }
                          ]
                        },
                        "panels": [
                          {
                            "id": 100,
                            "type": "row",
                            "title": "RATE",
                            "gridPos": {
                              "h": 1,
                              "w": 24,
                              "x": 0,
                              "y": 0
                            },
                            "collapsed": false
                          },
                          {
                            "id": 1,
                            "title": "Request rate (req/s)",
                            "type": "stat",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 7,
                              "w": 8,
                              "x": 0,
                              "y": 1
                            },
                            "targets": [
                              {
                                "expr": "sum(rate(shopnest_http_requests_total[5m]))",
                                "legendFormat": "total",
                                "refId": "A"
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {
                                "unit": "reqps"
                              },
                              "overrides": []
                            }
                          },
                          {
                            "id": 2,
                            "title": "Request rate by route",
                            "type": "timeseries",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 7,
                              "w": 16,
                              "x": 8,
                              "y": 1
                            },
                            "targets": [
                              {
                                "expr": "sum by (route) (rate(shopnest_http_requests_total[5m]))",
                                "legendFormat": "{{route}}",
                                "refId": "A"
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {
                                "unit": "reqps"
                              },
                              "overrides": []
                            }
                          },
                          {
                            "id": 200,
                            "type": "row",
                            "title": "ERRORS",
                            "gridPos": {
                              "h": 1,
                              "w": 24,
                              "x": 0,
                              "y": 8
                            },
                            "collapsed": false
                          },
                          {
                            "id": 3,
                            "title": "5xx error rate (%)",
                            "type": "stat",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 7,
                              "w": 8,
                              "x": 0,
                              "y": 9
                            },
                            "targets": [
                              {
                                "expr": "100 * sum(rate(shopnest_http_requests_total{status_code=~\"5..\"}[5m])) / clamp_min(sum(rate(shopnest_http_requests_total[5m])), 1e-9)",
                                "legendFormat": "5xx %",
                                "refId": "A"
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {
                                "unit": "percent",
                                "thresholds": {
                                  "mode": "absolute",
                                  "steps": [
                                    {
                                      "color": "green",
                                      "value": null
                                    },
                                    {
                                      "color": "orange",
                                      "value": 1
                                    },
                                    {
                                      "color": "red",
                                      "value": 5
                                    }
                                  ]
                                }
                              },
                              "overrides": []
                            }
                          },
                          {
                            "id": 4,
                            "title": "Responses by status code",
                            "type": "timeseries",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 7,
                              "w": 16,
                              "x": 8,
                              "y": 9
                            },
                            "targets": [
                              {
                                "expr": "sum by (status_code) (rate(shopnest_http_requests_total[5m]))",
                                "legendFormat": "{{status_code}}",
                                "refId": "A"
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {
                                "unit": "reqps"
                              },
                              "overrides": []
                            }
                          },
                          {
                            "id": 300,
                            "type": "row",
                            "title": "DURATION",
                            "gridPos": {
                              "h": 1,
                              "w": 24,
                              "x": 0,
                              "y": 16
                            },
                            "collapsed": false
                          },
                          {
                            "id": 5,
                            "title": "Latency p95 (s)",
                            "type": "stat",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 7,
                              "w": 8,
                              "x": 0,
                              "y": 17
                            },
                            "targets": [
                              {
                                "expr": "histogram_quantile(0.95, sum(rate(shopnest_http_request_duration_seconds_bucket[5m])) by (le))",
                                "legendFormat": "p95",
                                "refId": "A"
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {
                                "unit": "s"
                              },
                              "overrides": []
                            }
                          },
                          {
                            "id": 6,
                            "title": "Latency p50 / p95 / p99",
                            "type": "timeseries",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 7,
                              "w": 16,
                              "x": 8,
                              "y": 17
                            },
                            "targets": [
                              {
                                "expr": "histogram_quantile(0.50, sum(rate(shopnest_http_request_duration_seconds_bucket[5m])) by (le))",
                                "legendFormat": "p50",
                                "refId": "A"
                              },
                              {
                                "expr": "histogram_quantile(0.95, sum(rate(shopnest_http_request_duration_seconds_bucket[5m])) by (le))",
                                "legendFormat": "p95",
                                "refId": "B"
                              },
                              {
                                "expr": "histogram_quantile(0.99, sum(rate(shopnest_http_request_duration_seconds_bucket[5m])) by (le))",
                                "legendFormat": "p99",
                                "refId": "C"
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {
                                "unit": "s"
                              },
                              "overrides": []
                            }
                          },
                          {
                            "id": 400,
                            "type": "row",
                            "title": "BUSINESS",
                            "gridPos": {
                              "h": 1,
                              "w": 24,
                              "x": 0,
                              "y": 24
                            },
                            "collapsed": false
                          },
                          {
                            "id": 7,
                            "title": "Orders created (1h)",
                            "type": "stat",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 6,
                              "w": 6,
                              "x": 0,
                              "y": 25
                            },
                            "targets": [
                              {
                                "expr": "sum(increase(shopnest_orders_created_total[1h]))",
                                "legendFormat": "orders",
                                "refId": "A"
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {},
                              "overrides": []
                            }
                          },
                          {
                            "id": 8,
                            "title": "Order failures (1h)",
                            "type": "stat",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 6,
                              "w": 6,
                              "x": 6,
                              "y": 25
                            },
                            "targets": [
                              {
                                "expr": "sum(increase(shopnest_order_creation_failures_total[1h]))",
                                "legendFormat": "failures",
                                "refId": "A"
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {},
                              "overrides": []
                            }
                          },
                          {
                            "id": 9,
                            "title": "Orders by status",
                            "type": "timeseries",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 6,
                              "w": 12,
                              "x": 12,
                              "y": 25
                            },
                            "targets": [
                              {
                                "expr": "sum by (status) (shopnest_orders_by_status)",
                                "legendFormat": "{{status}}",
                                "refId": "A"
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {},
                              "overrides": []
                            }
                          },
                          {
                            "id": 10,
                            "title": "Payment verification: success vs failure",
                            "type": "timeseries",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 6,
                              "w": 12,
                              "x": 0,
                              "y": 31
                            },
                            "targets": [
                              {
                                "expr": "sum(rate(shopnest_payment_verification_success_total[5m]))",
                                "legendFormat": "success",
                                "refId": "A"
