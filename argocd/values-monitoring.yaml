                              {
                                "expr": "sum(rate(shopnest_payment_verification_failures_total[5m]))",
                                "legendFormat": "failure",
                                "refId": "B"
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {},
                              "overrides": []
                            }
                          },
                          {
                            "id": 11,
                            "title": "Payment attempts",
                            "type": "timeseries",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 6,
                              "w": 12,
                              "x": 12,
                              "y": 31
                            },
                            "targets": [
                              {
                                "expr": "sum(rate(shopnest_payment_attempts_total[5m]))",
                                "legendFormat": "attempts",
                                "refId": "A"
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {},
                              "overrides": []
                            }
                          },
                          {
                            "id": 500,
                            "type": "row",
                            "title": "HEALTH",
                            "gridPos": {
                              "h": 1,
                              "w": 24,
                              "x": 0,
                              "y": 37
                            },
                            "collapsed": false
                          },
                          {
                            "id": 12,
                            "title": "Scrape target up",
                            "type": "stat",
