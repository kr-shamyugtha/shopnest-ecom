applications:
  monitoring:
    namespace: argocd
    additionalLabels: {}
    additionalAnnotations: {}
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: monitoring
    sources:
      - chart: kube-prometheus-stack
        repoURL: https://prometheus-community.github.io/helm-charts
        targetRevision: 87.21.0
        helm:
          releaseName: monitoring
          values: |
            grafana:
              enabled: true
              deploymentStrategy:
                type: Recreate

              # Point at a secret created OUT OF BAND, not one this chart
              # generates. Without this the chart mints a NEW random admin
              # password into monitoring-grafana on every render - but
              # persistence is enabled, so Grafana keeps the password it
              # wrote into its SQLite DB at first install. The two diverge
              # immediately and every subsequent login fails with
              # "Invalid username or password", including the sidecar's own
              # provisioning reload calls (visible as 401s in the logs).
              #
              # Created once, deliberately not in Git:
              #   kubectl create secret generic grafana-admin-credentials \
              #     -n monitoring \
              #     --from-literal=admin-user=admin \
              #     --from-literal=admin-password='<password>'
              #
              # If the DB and this secret are already out of step, realign
              # them once with:
              #   kubectl exec -n monitoring deploy/monitoring-grafana -c grafana -- \
              #     grafana cli --homepath /usr/share/grafana \
              #     admin reset-admin-password '<password>'
              admin:
                existingSecret: grafana-admin-credentials
                userKey: admin-user
                passwordKey: admin-password
              persistence:
                enabled: true
                type: pvc
                size: 5Gi
              # Sized from MEASURED usage, not guessed. The first attempt at
              # this (limit 256Mi) OOMKilled Grafana twice - exit 137 - because
              # steady-state sits at ~190Mi and rendering a dashboard spikes
              # well past that. Grafana loads all 30 provisioned dashboards
              # into memory, so it is the heaviest thing in this namespace
              # despite looking like the lightest.
              #
              # Observed: cpu 129m, memory 189Mi. Request now covers the
              # steady state; the limit leaves room for render spikes rather
              # than sitting on top of them.
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              additionalDataSources:
                - name: Loki
                  type: loki
                  access: proxy
                  url: http://loki-gateway.monitoring.svc.cluster.local
                  isDefault: false

              # ------------------------------------------------------
              # ShopNest dashboard, provisioned as a file through Grafana's
              # dashboardProviders rather than through the chart's
              # extraManifests.
              #
              # extraManifests looks like the obvious place, but it renders
              # every manifest through Helm's `tpl`. Grafana's legend syntax
              # is {{label}}, which Helm then tries to evaluate as a function
              # call and the whole sync dies with
              #   function "route" not defined
              # This path embeds the JSON verbatim - verified by rendering
              # the chart locally - so Grafana's braces survive intact.
              #
              # Every query uses only metrics backend/metrics/metrics.js
              # actually exports. Denominators are wrapped in
              # clamp_min(..., 1e-9) so the percentage panels read 0 at idle
              # instead of NaN.
              # ------------------------------------------------------
              dashboardProviders:
                dashboardproviders.yaml:
                  apiVersion: 1
                  providers:
                    - name: shopnest
                      orgId: 1
                      folder: ShopNest
                      type: file
                      disableDeletion: false
                      editable: true
                      options:
                        path: /var/lib/grafana/dashboards/shopnest
              dashboards:
                shopnest:
                  shopnest-red:
                    json: |
                      {
                        "title": "ShopNest \u2014 Platform Overview",
                        "uid": "shopnest-red",
                        "tags": [
                          "shopnest"
                        ],
                        "timezone": "browser",
                        "schemaVersion": 39,
                        "refresh": "30s",
                        "editable": true,
                        "time": {
                          "from": "now-1h",
                          "to": "now"
                        },
                        "templating": {
                          "list": [
                            {
                              "name": "DS_PROMETHEUS",
                              "type": "datasource",
                              "query": "prometheus",
                              "label": "Prometheus",
                              "current": {
                                "text": "Prometheus",
                                "value": "Prometheus"
                              },
                              "hide": 0,
                              "refresh": 1
                            },
                            {
                              "name": "DS_LOKI",
                              "type": "datasource",
                              "query": "loki",
                              "label": "Loki",
                              "current": {
                                "text": "Loki",
                                "value": "Loki"
                              },
                              "hide": 0,
                              "refresh": 1
                            },
                            {
                              "name": "namespace",
                              "type": "query",
                              "datasource": {
                                "type": "prometheus",
                                "uid": "${DS_PROMETHEUS}"
                              },
                              "query": "label_values(kube_pod_info, namespace)",
                              "label": "Namespace",
                              "refresh": 2,
                              "includeAll": true,
                              "multi": true,
                              "sort": 1,
                              "current": {
                                "text": "shopnest",
                                "value": "shopnest"
                              }
                            },
                            {
                              "name": "pod",
                              "type": "query",
                              "datasource": {
                                "type": "prometheus",
                                "uid": "${DS_PROMETHEUS}"
                              },
                              "query": "label_values(kube_pod_info{namespace=~\"$namespace\"}, pod)",
                              "label": "Pod",
                              "refresh": 2,
                              "includeAll": true,
                              "multi": true,
                              "sort": 1,
                              "current": {
                                "text": "All",
                                "value": "$__all"
                              }
                            },
                            {
                              "name": "route",
                              "type": "query",
                              "datasource": {
                                "type": "prometheus",
                                "uid": "${DS_PROMETHEUS}"
                              },
                              "query": "label_values(shopnest_http_requests_total, route)",
                              "label": "Route",
                              "refresh": 2,
                              "includeAll": true,
                              "multi": true,
                              "sort": 1,
                              "current": {
                                "text": "All",
                                "value": "$__all"
                              }
                            }
                          ]
                        },
                        "panels": [
                          {
                            "id": 1,
                            "type": "row",
                            "title": "Orders  \u00b7  gauges read live from MongoDB Atlas on every scrape",
                            "collapsed": false,
                            "gridPos": {
                              "h": 1,
                              "w": 24,
                              "x": 0,
                              "y": 0
                            }
                          },
                          {
                            "id": 2,
                            "title": "Total Orders (Atlas)",
                            "type": "stat",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 5,
                              "w": 5,
                              "x": 0,
                              "y": 1
                            },
                            "targets": [
                              {
                                "expr": "max(shopnest_orders_total)",
                                "legendFormat": "orders",
                                "refId": "A",
                                "datasource": {
                                  "type": "prometheus",
                                  "uid": "${DS_PROMETHEUS}"
                                }
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {},
                              "overrides": []
                            },
                            "description": "Gauge: Order.countDocuments() at scrape time. max() not sum() - every backend replica reports the SAME database count, so sum() would multiply by replica count once the HPA scales past 1."
                          },
                          {
                            "id": 3,
                            "title": "Pending",
                            "type": "stat",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 5,
                              "w": 5,
                              "x": 5,
                              "y": 1
                            },
                            "targets": [
                              {
                                "expr": "max(shopnest_orders_by_status{status=\"Pending\"})",
                                "legendFormat": "pending",
                                "refId": "A",
                                "datasource": {
                                  "type": "prometheus",
                                  "uid": "${DS_PROMETHEUS}"
                                }
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {
                                "color": {
                                  "mode": "fixed",
                                  "fixedColor": "orange"
                                }
                              },
                              "overrides": []
                            }
                          },
                          {
                            "id": 4,
                            "title": "Shipped",
                            "type": "stat",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 5,
                              "w": 5,
                              "x": 10,
                              "y": 1
                            },
                            "targets": [
                              {
                                "expr": "max(shopnest_orders_by_status{status=\"Shipped\"})",
                                "legendFormat": "shipped",
                                "refId": "A",
                                "datasource": {
                                  "type": "prometheus",
                                  "uid": "${DS_PROMETHEUS}"
                                }
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {
                                "color": {
                                  "mode": "fixed",
                                  "fixedColor": "blue"
                                }
                              },
                              "overrides": []
                            }
                          },
                          {
                            "id": 5,
                            "title": "Delivered",
                            "type": "stat",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 5,
                              "w": 5,
                              "x": 15,
                              "y": 1
                            },
                            "targets": [
                              {
                                "expr": "max(shopnest_orders_by_status{status=\"Delivered\"})",
                                "legendFormat": "delivered",
                                "refId": "A",
                                "datasource": {
                                  "type": "prometheus",
                                  "uid": "${DS_PROMETHEUS}"
                                }
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {
                                "color": {
                                  "mode": "fixed",
                                  "fixedColor": "green"
                                }
                              },
                              "overrides": []
                            }
                          },
                          {
                            "id": 6,
                            "title": "Created since restart",
                            "type": "stat",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 5,
                              "w": 4,
                              "x": 20,
                              "y": 1
                            },
                            "targets": [
                              {
                                "expr": "sum(shopnest_orders_created_total)",
                                "legendFormat": "created",
                                "refId": "A",
                                "datasource": {
                                  "type": "prometheus",
                                  "uid": "${DS_PROMETHEUS}"
                                }
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {
                                "color": {
                                  "mode": "fixed",
                                  "fixedColor": "text"
                                }
                              },
                              "overrides": []
                            },
                            "description": "Counter, in-process: resets to 0 when the pod restarts. Use 'Total Orders (Atlas)' for the authoritative figure."
                          },
                          {
                            "id": 7,
                            "title": "Orders by Status Over Time",
                            "type": "timeseries",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 7,
                              "w": 12,
                              "x": 0,
                              "y": 6
                            },
                            "targets": [
                              {
                                "expr": "max by (status) (shopnest_orders_by_status)",
                                "legendFormat": "{{status}}",
                                "refId": "A",
                                "datasource": {
                                  "type": "prometheus",
                                  "uid": "${DS_PROMETHEUS}"
                                }
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {},
                              "overrides": []
                            }
                          },
                          {
                            "id": 8,
                            "title": "Order Creation / Failure Rate (per min)",
                            "type": "timeseries",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 7,
                              "w": 12,
                              "x": 12,
                              "y": 6
                            },
                            "targets": [
                              {
                                "expr": "sum(rate(shopnest_orders_created_total[5m])) * 60",
                                "legendFormat": "created/min",
                                "refId": "A",
                                "datasource": {
                                  "type": "prometheus",
                                  "uid": "${DS_PROMETHEUS}"
                                }
                              },
                              {
                                "expr": "sum(rate(shopnest_order_creation_failures_total[5m])) * 60",
                                "legendFormat": "failed/min",
                                "refId": "B",
                                "datasource": {
                                  "type": "prometheus",
                                  "uid": "${DS_PROMETHEUS}"
                                }
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {},
                              "overrides": []
                            },
                            "description": "rate() is valid here - both are true counters. sum() is correct because each replica counts only its own work."
                          },
                          {
                            "id": 9,
                            "type": "row",
                            "title": "Payments",
                            "collapsed": false,
                            "gridPos": {
                              "h": 1,
                              "w": 24,
                              "x": 0,
                              "y": 13
                            }
                          },
                          {
                            "id": 10,
                            "title": "Payment Attempts (Atlas)",
                            "type": "stat",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 5,
                              "w": 6,
                              "x": 0,
                              "y": 14
                            },
                            "targets": [
                              {
                                "expr": "max(shopnest_payment_attempts_total)",
                                "legendFormat": "attempts",
                                "refId": "A",
                                "datasource": {
                                  "type": "prometheus",
                                  "uid": "${DS_PROMETHEUS}"
                                }
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {},
                              "overrides": []
                            },
                            "description": "Despite the _total suffix this is a GAUGE - PaymentAttempt.countDocuments() at scrape time. rate() on it is semantically wrong; it is not a counter."
                          },
                          {
                            "id": 11,
                            "title": "Verification Successes",
                            "type": "stat",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 5,
                              "w": 6,
                              "x": 6,
                              "y": 14
                            },
                            "targets": [
                              {
                                "expr": "sum(shopnest_payment_verification_success_total)",
                                "legendFormat": "success",
                                "refId": "A",
                                "datasource": {
                                  "type": "prometheus",
                                  "uid": "${DS_PROMETHEUS}"
                                }
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {
                                "color": {
                                  "mode": "fixed",
                                  "fixedColor": "green"
                                }
                              },
                              "overrides": []
                            }
                          },
                          {
                            "id": 12,
                            "title": "Verification Failures",
                            "type": "stat",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 5,
                              "w": 6,
                              "x": 12,
                              "y": 14
                            },
                            "targets": [
                              {
                                "expr": "sum(shopnest_payment_verification_failures_total)",
                                "legendFormat": "failures",
                                "refId": "A",
                                "datasource": {
                                  "type": "prometheus",
                                  "uid": "${DS_PROMETHEUS}"
                                }
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {
                                "color": {
                                  "mode": "fixed",
                                  "fixedColor": "red"
                                }
                              },
                              "overrides": []
                            }
                          },
                          {
                            "id": 13,
                            "title": "Payment Success Rate",
                            "type": "gauge",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 5,
                              "w": 6,
                              "x": 18,
                              "y": 14
                            },
                            "targets": [
                              {
                                "expr": "sum(shopnest_payment_verification_success_total) / clamp_min(sum(shopnest_payment_verification_success_total) + sum(shopnest_payment_verification_failures_total), 1)",
                                "legendFormat": "success rate",
                                "refId": "A",
                                "datasource": {
                                  "type": "prometheus",
                                  "uid": "${DS_PROMETHEUS}"
                                }
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {
                                "unit": "percentunit",
                                "min": 0,
                                "max": 1,
                                "thresholds": {
                                  "mode": "absolute",
                                  "steps": [
                                    {
                                      "color": "red",
                                      "value": null
                                    },
                                    {
                                      "color": "orange",
                                      "value": 0.8
                                    },
                                    {
                                      "color": "green",
                                      "value": 0.95
                                    }
                                  ]
                                }
                              },
                              "overrides": []
                            },
                            "description": "clamp_min(...,1) keeps this at 0 rather than NaN before any payment has been verified."
                          },
                          {
                            "id": 14,
                            "title": "Verification Rate (per min)",
                            "type": "timeseries",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 7,
                              "w": 12,
                              "x": 0,
                              "y": 19
                            },
                            "targets": [
                              {
                                "expr": "sum(rate(shopnest_payment_verification_success_total[5m])) * 60",
                                "legendFormat": "success/min",
                                "refId": "A",
                                "datasource": {
                                  "type": "prometheus",
                                  "uid": "${DS_PROMETHEUS}"
                                }
                              },
                              {
                                "expr": "sum(rate(shopnest_payment_verification_failures_total[5m])) * 60",
                                "legendFormat": "failure/min",
                                "refId": "B",
                                "datasource": {
                                  "type": "prometheus",
                                  "uid": "${DS_PROMETHEUS}"
                                }
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {},
                              "overrides": []
                            }
                          },
                          {
                            "id": 15,
                            "title": "Payment Attempts Over Time (Atlas)",
                            "type": "timeseries",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 7,
                              "w": 12,
                              "x": 12,
                              "y": 19
                            },
                            "targets": [
                              {
                                "expr": "max(shopnest_payment_attempts_total)",
                                "legendFormat": "attempts",
                                "refId": "A",
                                "datasource": {
                                  "type": "prometheus",
                                  "uid": "${DS_PROMETHEUS}"
                                }
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {},
                              "overrides": []
                            },
                            "description": "Plotted as the absolute gauge value. A rate() here would be meaningless."
                          },
                          {
                            "id": 16,
                            "type": "row",
                            "title": "HTTP Performance  \u00b7  filtered by $route",
                            "collapsed": false,
                            "gridPos": {
                              "h": 1,
                              "w": 24,
                              "x": 0,
                              "y": 26
                            }
                          },
                          {
                            "id": 17,
                            "title": "Request Rate",
                            "type": "stat",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 5,
                              "w": 6,
                              "x": 0,
                              "y": 27
                            },
                            "targets": [
                              {
                                "expr": "sum(rate(shopnest_http_requests_total{route=~\"$route\"}[5m]))",
                                "legendFormat": "req/s",
                                "refId": "A",
                                "datasource": {
                                  "type": "prometheus",
                                  "uid": "${DS_PROMETHEUS}"
                                }
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {
                                "unit": "reqps"
                              },
                              "overrides": []
                            },
                            "options": {
                              "reduceOptions": {
                                "calcs": [
                                  "lastNotNull"
                                ],
                                "fields": "",
                                "values": false
                              },
                              "textMode": "auto",
                              "colorMode": "value",
                              "graphMode": "area"
                            }
                          },
                          {
                            "id": 18,
                            "title": "Error Rate (5xx)",
                            "type": "stat",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 5,
                              "w": 6,
                              "x": 6,
                              "y": 27
                            },
                            "targets": [
                              {
                                "expr": "(sum(rate(shopnest_http_requests_total{status_code=~\"5..\", route=~\"$route\"}[5m])) or vector(0)) / clamp_min(sum(rate(shopnest_http_requests_total{route=~\"$route\"}[5m])), 0.001)",
                                "legendFormat": "5xx",
                                "refId": "A",
                                "datasource": {
                                  "type": "prometheus",
                                  "uid": "${DS_PROMETHEUS}"
                                }
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {
                                "unit": "percentunit",
                                "thresholds": {
                                  "mode": "absolute",
                                  "steps": [
                                    {
                                      "color": "green",
                                      "value": null
                                    },
                                    {
                                      "color": "orange",
                                      "value": 0.01
                                    },
                                    {
                                      "color": "red",
                                      "value": 0.05
                                    }
                                  ]
                                }
                              },
                              "overrides": []
                            },
                            "description": "`or vector(0)` matters: with no 5xx series in range, sum(rate(...)) returns NO SAMPLES rather than zero, so the panel would read 'No data' precisely when the service is healthy. vector(0) makes the healthy case render as 0%."
                          },
                          {
                            "id": 19,
                            "title": "p95 Latency",
                            "type": "stat",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 5,
                              "w": 6,
                              "x": 12,
                              "y": 27
                            },
                            "targets": [
                              {
                                "expr": "histogram_quantile(0.95, sum(rate(shopnest_http_request_duration_seconds_bucket{route=~\"$route\"}[5m])) by (le))",
                                "legendFormat": "p95",
                                "refId": "A",
                                "datasource": {
                                  "type": "prometheus",
                                  "uid": "${DS_PROMETHEUS}"
                                }
                              }
                            ],
                            "fieldConfig": {
                              "defaults": {
                                "unit": "s"
                              },
                              "overrides": []
                            }
                          },
                          {
                            "id": 20,
                            "title": "p99 Latency",
                            "type": "stat",
                            "datasource": {
                              "type": "prometheus",
                              "uid": "${DS_PROMETHEUS}"
                            },
                            "gridPos": {
                              "h": 5,
                              "w": 6,
                              "x": 18,
                              "y": 27
                            },
                            "targets": [
                              {
