applications:
  shopnest:
    namespace: argocd
    additionalLabels: {}
    additionalAnnotations: {}
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: shopnest
    sources:
      # HTTPS clone URL for this Azure Repos repo — Argo CD needs repo
      # credentials configured for this (it's private), separate from this
      # values file. This is kavitography/shopnest-ado, the org the CI
      # pipeline actually pushes to — NOT shopnest-devops/ShopNest, an
      # older/parallel repo that had diverged.
      - repoURL: https://dev.azure.com/kavitography/shopnest-ado/_git/shopnest-ado
        path: helm/shopnest
        targetRevision: HEAD
        helm:
          releaseName: shopnest
          valueFiles:
            - values-azure.yaml
            - environments/azure/dev.yaml
    destination:
      server: https://kubernetes.default.svc
      # Must match where the app actually runs — every other piece
      # (CI, the federated identity subject, the NetworkPolicies) already
      # assumes the "shopnest" namespace.
      namespace: shopnest
    syncPolicy:
      # Manual-first verification is done: the release synced cleanly and
      # survived two real fixes (image tag, workload identity clientId).
      # No "critical" gate applies to dev, so full automation is correct —
      # Argo CD should always just reconcile whatever Git says, no human
      # click required. (Prod, when it exists, gets its gate upstream — a
      # pipeline approval before the commit lands — never here.)
      automated:
        selfHeal: true
        prune: true
      syncOptions:
        - CreateNamespace=true

projects:
  shopnest:
    namespace: argocd
    additionalLabels: {}
    additionalAnnotations: {}
    permitOnlyProjectScopedClusters: false
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    description: ShopNest application delivery
    sourceRepos:
      - https://dev.azure.com/kavitography/shopnest-ado/_git/shopnest-ado
    destinations:
      - namespace: shopnest
        server: https://kubernetes.default.svc
    # Cluster-scoped resources denied by default except Namespace itself —
    # needed because syncPolicy.syncOptions has CreateNamespace=true, and
    # that goes through this same project permission check (confirmed live:
    # omitting this produced "resource :Namespace is not permitted in
    # project shopnest" and the sync retried in a loop, never progressing
    # past PreSync). Namespace-scoped kinds explicitly limited to what the
    # app actually needs — notably excludes Role/RoleBinding, so a
    # compromised or mis-templated chart change can never grant itself
    # permissions via a synced manifest.
    clusterResourceWhitelist:
      - group: ""
        kind: Namespace
    namespaceResourceWhitelist:
      - group: "apps"
        kind: Deployment
      - group: ""
        kind: Service
      - group: ""
        kind: ServiceAccount
      - group: ""
        kind: ConfigMap
      - group: "autoscaling"
        kind: HorizontalPodAutoscaler
      - group: "policy"
        kind: PodDisruptionBudget
      - group: "networking.k8s.io"
        kind: NetworkPolicy
      - group: "networking.k8s.io"
        kind: Ingress
      - group: "secrets-store.csi.x-k8s.io"
        kind: SecretProviderClass
