trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:

  # ============================================================
  # Stage 1: Test
  # ============================================================
  - stage: Test
    displayName: "Run Tests"

    jobs:

      - job: ApplicationTests
        displayName: "Backend and Frontend Tests"

        steps:

          - checkout: self
            displayName: "Checkout Source Code"

          - task: UseNode@1
            displayName: "Install Node.js"
            inputs:
              version: "20.x"

          - script: |
              cd backend
              npm ci
              npm test -- --ci
            displayName: "Run Backend Tests"

          - script: |
              cd frontend
              npm ci
              npm test -- --watchAll=false
            displayName: "Run Frontend Tests"


  # ============================================================
  # Stage 2: Build
  # ============================================================
  - stage: Build
    displayName: "Build Application"

    dependsOn: Test
    condition: succeeded()

    jobs:

      - job: ApplicationBuild
        displayName: "Build Frontend"

        steps:

          - checkout: self
            displayName: "Checkout Source Code"

          - task: UseNode@1
            displayName: "Install Node.js"
            inputs:
              version: "20.x"

          - script: |
              cd backend
              npm ci
            displayName: "Install Backend Dependencies"

          - script: |
              cd frontend
              npm ci
              npm run build
            displayName: "Build Frontend"
            
  # ============================================================
  # Stage 3: SonarCloud Code Quality
  # ============================================================
  - stage: CodeQuality
    displayName: "SonarCloud Code Quality"

    dependsOn: Build
    condition: succeeded()

    jobs:
    - job: SonarCloudAnalysis
      displayName: "SonarCloud Analysis"

      steps:
        - checkout: self

        - task: SonarCloudPrepare@3
          displayName: "Prepare SonarCloud Analysis"
          inputs:
            SonarCloud: "SonarCloud-ShopNest"
            organization: "kr-shamyugtha"
            scannerMode: "CLI"
            configMode: "file"

        - task: SonarCloudAnalyze@3
          displayName: "Run SonarCloud Analysis"

        - task: SonarCloudPublish@3
          displayName: "Publish SonarCloud Quality Gate"
          inputs:
            pollingTimeoutSec: "300"

  # ============================================================
  # Stage 4: Docker Build
  # ============================================================
  - stage: DockerBuild
    displayName: "Build Docker Images"

    dependsOn: CodeQuality
    condition: succeeded()

    jobs:
      - job: BuildImages
        displayName: "Build Backend and Frontend Images"

        steps:
          - checkout: self

          - script: |
              set -e

              BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              VERSION="1.0.$(Build.BuildId)"

              echo "Building ShopNest Docker images"
              echo "Version: $VERSION"

              docker build \
                --build-arg BUILD_DATE="$BUILD_DATE" \
                --build-arg VERSION="$VERSION" \
                -t shopnestdevacr2.azurecr.io/shopnest-backend:"$VERSION" \
                ./backend

              docker build \
                --build-arg BUILD_DATE="$BUILD_DATE" \
                --build-arg VERSION="$VERSION" \
                -t shopnestdevacr2.azurecr.io/shopnest-frontend:"$VERSION" \
                ./frontend

              echo "Docker images built successfully:"
              docker images | grep "shopnestdevacr2.azurecr.io/shopnest-"
            displayName: "Build Backend and Frontend Docker Images"