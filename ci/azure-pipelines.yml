trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:

  # ============================================================
  # Stage 1: Test
  # ============================================================
  - stage: Test
    displayName: "Run Tests"

    jobs:

      - job: ApplicationTests
        displayName: "Backend and Frontend Tests"

        steps:

          - checkout: self
            displayName: "Checkout Source Code"

          - task: UseNode@1
            displayName: "Install Node.js"
            inputs:
              version: "20.x"

          - script: |
              cd backend
              npm ci
              npm test -- --ci
            displayName: "Run Backend Tests"

          - script: |
              cd frontend
              npm ci
              npm test -- --watchAll=false
            displayName: "Run Frontend Tests"


  # ============================================================
  # Stage 2: Build
  # ============================================================
  - stage: Build
    displayName: "Build Application"

    dependsOn: Test
    condition: succeeded()

    jobs:

      - job: ApplicationBuild
        displayName: "Build Frontend"

        steps:

          - checkout: self
            displayName: "Checkout Source Code"

          - task: UseNode@1
            displayName: "Install Node.js"
            inputs:
              version: "20.x"

          - script: |
              cd backend
              npm ci
            displayName: "Install Backend Dependencies"

          - script: |
              cd frontend
              npm ci
              npm run build
            displayName: "Build Frontend"
            
  # ============================================================
  # Stage 3: SonarCloud Code Quality
  # ============================================================
  - stage: CodeQuality
    displayName: "SonarCloud Code Quality"

    dependsOn: Build
    condition: succeeded()

    jobs:
    - job: SonarCloudAnalysis
      displayName: "SonarCloud Analysis"

      steps:
        - checkout: self

        - task: SonarCloudPrepare@3
          displayName: "Prepare SonarCloud Analysis"
          inputs:
            SonarCloud: "SonarCloud-ShopNest"
            organization: "kr-shamyugtha"
            scannerMode: "CLI"
            configMode: "file"

        - task: SonarCloudAnalyze@3
          displayName: "Run SonarCloud Analysis"

        - task: SonarCloudPublish@3
          displayName: "Publish SonarCloud Quality Gate"
          inputs:
            pollingTimeoutSec: "300"

  # ============================================================
  # Stage 4: Docker Build
  # ============================================================
  - stage: DockerBuild
    displayName: "Build Docker Images"

    dependsOn: CodeQuality
    condition: succeeded()

    jobs:
      - job: BuildImages
        displayName: "Build Backend and Frontend Images"

        steps:
          - checkout: self
            displayName: "Checkout Source Code"

          - script: |
              set -e

              BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              VERSION="1.0.$(Build.BuildId)"

              BACKEND_IMAGE="shopnestdevacr2.azurecr.io/shopnest-backend"
              FRONTEND_IMAGE="shopnestdevacr2.azurecr.io/shopnest-frontend"

              echo "=========================================="
              echo "Building ShopNest Docker images"
              echo "=========================================="
              echo "Version: $VERSION"
              echo "Build Date: $BUILD_DATE"
              echo ""

              # ==================================================
              # Build Backend Image
              # ==================================================
              echo "Building backend image..."

              docker build \
                --build-arg BUILD_DATE="$BUILD_DATE" \
                --build-arg VERSION="$VERSION" \
                -t "$BACKEND_IMAGE:$VERSION" \
                ./backend

              # ==================================================
              # Build Frontend Image
              # ==================================================
              echo "Building frontend image..."

              docker build \
                --build-arg BUILD_DATE="$BUILD_DATE" \
                --build-arg VERSION="$VERSION" \
                -t "$FRONTEND_IMAGE:$VERSION" \
                ./frontend

              # ==================================================
              # Verify Images
              # ==================================================
              echo ""
              echo "=========================================="
              echo "Verifying Docker images"
              echo "=========================================="

              docker image inspect "$BACKEND_IMAGE:$VERSION" > /dev/null
              docker image inspect "$FRONTEND_IMAGE:$VERSION" > /dev/null

              docker images | grep "shopnestdevacr2.azurecr.io/shopnest-"

              # ==================================================
              # Save Exact Images for Security Scanning
              # ==================================================
              echo ""
              echo "=========================================="
              echo "Saving Docker images for Trivy scan"
              echo "=========================================="

              mkdir -p "$(Build.ArtifactStagingDirectory)/docker-images"

              docker save \
                "$BACKEND_IMAGE:$VERSION" \
                -o "$(Build.ArtifactStagingDirectory)/docker-images/shopnest-backend.tar"

              docker save \
                "$FRONTEND_IMAGE:$VERSION" \
                -o "$(Build.ArtifactStagingDirectory)/docker-images/shopnest-frontend.tar"

              # ==================================================
              # Verify Saved Artifacts
              # ==================================================
              echo ""
              echo "=========================================="
              echo "Docker image artifacts"
              echo "=========================================="

              ls -lh "$(Build.ArtifactStagingDirectory)/docker-images"

              echo ""
              echo "Docker images successfully built and saved."
            displayName: "Build and Save Docker Images"

          # ======================================================
          # Publish exact Docker images for the SecurityScan stage
          # ======================================================
          - task: PublishPipelineArtifact@1
            displayName: "Publish Docker Images"
            inputs:
              targetPath: "$(Build.ArtifactStagingDirectory)/docker-images"
              artifact: "docker-images"
              publishLocation: "pipeline"

  # ============================================================
  # Stage 5: Container Security Scan - Trivy
  # ============================================================
  - stage: SecurityScan
    displayName: "Trivy Container Security Scan"

    dependsOn: DockerBuild
    condition: succeeded()

    jobs:
      - job: TrivyScan
        displayName: "Scan Docker Images for Vulnerabilities"

        steps:

          - checkout: none

          # ----------------------------------------------------
          # Download Docker image artifacts
          # ----------------------------------------------------
          - task: DownloadPipelineArtifact@2
            displayName: "Download Docker Images"
            inputs:
              artifact: docker-images
              path: "$(Pipeline.Workspace)/docker-images"

          # ----------------------------------------------------
          # Load Docker images into the Docker daemon
          # ----------------------------------------------------
          - script: |
              set -e

              echo "Loading backend Docker image..."
              docker load \
                -i "$(Pipeline.Workspace)/docker-images/shopnest-backend.tar"

              echo "Loading frontend Docker image..."
              docker load \
                -i "$(Pipeline.Workspace)/docker-images/shopnest-frontend.tar"

              echo ""
              echo "Loaded Docker images:"
              docker images | grep "shopnestdevacr2.azurecr.io/shopnest-"
            displayName: "Load Docker Images"

          # ----------------------------------------------------
          # Install Trivy
          # ----------------------------------------------------
          - script: |
              set -e

              echo "Installing Trivy..."

              sudo apt-get update
              sudo apt-get install -y wget apt-transport-https gnupg lsb-release

              wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
                | gpg --dearmor \
                | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

              echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
                https://aquasecurity.github.io/trivy-repo/deb \
                $(lsb_release -sc) main" \
                | sudo tee /etc/apt/sources.list.d/trivy.list

              sudo apt-get update
              sudo apt-get install -y trivy

              trivy --version
            displayName: "Install Trivy"

          # ----------------------------------------------------
          # Scan Backend
          # ----------------------------------------------------
          - script: |
              set -e

              VERSION="1.0.$(Build.BuildId)"
              BACKEND_IMAGE="shopnestdevacr2.azurecr.io/shopnest-backend:$VERSION"

              echo "================================================"
              echo "Scanning Backend Image"
              echo "Image: $BACKEND_IMAGE"
              echo "================================================"

              trivy image \
                --exit-code 1 \
                --severity CRITICAL \
                --no-progress \
                --timeout 5m \
                --ignore-unfixed \
                "$BACKEND_IMAGE"

            displayName: "Trivy Scan - Backend"

          # ----------------------------------------------------
          # Scan Frontend
          # ----------------------------------------------------
          - script: |
              set -e

              VERSION="1.0.$(Build.BuildId)"
              FRONTEND_IMAGE="shopnestdevacr2.azurecr.io/shopnest-frontend:$VERSION"

              echo "================================================"
              echo "Scanning Frontend Image"
              echo "Image: $FRONTEND_IMAGE"
              echo "================================================"

              trivy image \
                --exit-code 1 \
                --severity CRITICAL \
                --no-progress \
                --timeout 5m \
                --ignore-unfixed \
                "$FRONTEND_IMAGE"

            displayName: "Trivy Scan - Frontend"

  # ============================================================
  # Stage 6: Push Images to ACR
  # ============================================================
  - stage: PushToACR
    displayName: "Push Docker Images to ACR"

    dependsOn: SecurityScan
    condition: succeeded()

    jobs:
    - job: PushImages
      displayName: "Push Approved Images"

      steps:
        - checkout: none

        # Authenticate to Azure using OIDC
        - task: AzureCLI@2
          displayName: "Login to Azure and Push Images"
          inputs:
            azureSubscription: "sc-shopnest-azure"
            scriptType: "bash"
            scriptLocation: "inlineScript"
            inlineScript: |
              set -euo pipefail

              VERSION="1.0.$(Build.BuildId)"
              ACR_NAME="shopnestdevacr2"
              ACR_LOGIN_SERVER="${ACR_NAME}.azurecr.io"

              BACKEND_IMAGE="${ACR_LOGIN_SERVER}/shopnest-backend:${VERSION}"
              FRONTEND_IMAGE="${ACR_LOGIN_SERVER}/shopnest-frontend:${VERSION}"

              echo "=============================================="
              echo "Authenticating to Azure Container Registry"
              echo "=============================================="

              az acr login --name "$ACR_NAME"

              echo "Pushing backend image:"
              echo "$BACKEND_IMAGE"

              docker push "$BACKEND_IMAGE"

              echo "Pushing frontend image:"
              echo "$FRONTEND_IMAGE"

              docker push "$FRONTEND_IMAGE"

              echo "=============================================="
              echo "Images pushed successfully"
              echo "=============================================="

              echo "$BACKEND_IMAGE"
              echo "$FRONTEND_IMAGE"