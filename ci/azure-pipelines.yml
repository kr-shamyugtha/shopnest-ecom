trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:

  # ============================================================
  # Stage 1: Tests
  # ============================================================
  - stage: Test
    displayName: "Run Tests"

    jobs:
      - job: BackendTests
        displayName: "Backend Tests"

        steps:
          - checkout: self

          - task: UseNode@1
            displayName: "Install Node.js"
            inputs:
              version: "20.x"

          - script: |
              cd backend
              npm ci
              npm test
            displayName: "Run backend tests"


  # ============================================================
  # Stage 2: Build
  # ============================================================
  - stage: Build
    displayName: "Build Application"

    dependsOn: Test
    condition: succeeded()

    jobs:
      - job: ApplicationBuild
        displayName: "Build Frontend"

        steps:
          - checkout: self

          - task: UseNode@1
            displayName: "Install Node.js"
            inputs:
              version: "20.x"

          - script: |
              cd backend
              npm ci
            displayName: "Install backend dependencies"

          - script: |
              cd frontend
              npm ci
              npm run build
            displayName: "Build frontend"