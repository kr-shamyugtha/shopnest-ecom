trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:

  # ============================================================
  # Stage 1: Test
  # ============================================================
  - stage: Test
    displayName: "Run Tests"

    jobs:

      - job: ApplicationTests
        displayName: "Backend and Frontend Tests"

        steps:

          - checkout: self
            displayName: "Checkout Source Code"

          - task: UseNode@1
            displayName: "Install Node.js"
            inputs:
              version: "20.x"

          - script: |
              cd backend
              npm ci
              npm test -- --ci
            displayName: "Run Backend Tests"

          - script: |
              cd frontend
              npm ci
              npm test -- --watchAll=false
            displayName: "Run Frontend Tests"


  # ============================================================
  # Stage 2: Build
  # ============================================================
  - stage: Build
    displayName: "Build Application"

    dependsOn: Test
    condition: succeeded()

    jobs:

      - job: ApplicationBuild
        displayName: "Build Frontend"

        steps:

          - checkout: self
            displayName: "Checkout Source Code"

          - task: UseNode@1
            displayName: "Install Node.js"
            inputs:
              version: "20.x"

          - script: |
              cd backend
              npm ci
            displayName: "Install Backend Dependencies"

          - script: |
              cd frontend
              npm ci
              npm run build
            displayName: "Build Frontend"
            
  # ============================================================
  # Stage 3: SonarCloud Code Quality
  # ============================================================
  - stage: CodeQuality
    displayName: "SonarCloud Code Quality"

    dependsOn: Build
    condition: succeeded()

    jobs:
    - job: SonarCloudAnalysis
      displayName: "SonarCloud Analysis"

      steps:
        - checkout: self

        - task: SonarCloudPrepare@3
          displayName: "Prepare SonarCloud Analysis"
          inputs:
            SonarCloud: "SonarCloud-ShopNest"
            organization: "kr-shamyugtha"
            scannerMode: "CLI"
            configMode: "file"

        - task: SonarCloudAnalyze@3
          displayName: "Run SonarCloud Analysis"

        - task: SonarCloudPublish@3
          displayName: "Publish SonarCloud Quality Gate"
          inputs:
            pollingTimeoutSec: "300"

  # ============================================================
  # Stage 4: Docker Build
  # ============================================================
  - stage: DockerBuild
    displayName: "Build Docker Images"

    dependsOn: CodeQuality
    condition: succeeded()

    jobs:
      - job: BuildImages
        displayName: "Build Backend and Frontend Images"

        steps:
          - checkout: self
            displayName: "Checkout Source Code"

          - script: |
              set -e

              BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              VERSION="1.0.$(Build.BuildId)"

              BACKEND_IMAGE="shopnestacr.azurecr.io/shopnest-backend"
              FRONTEND_IMAGE="shopnestacr.azurecr.io/shopnest-frontend"

              echo "=========================================="
              echo "Building ShopNest Docker images"
              echo "=========================================="
              echo "Version: $VERSION"
              echo "Build Date: $BUILD_DATE"
              echo ""

              # ==================================================
              # Build Backend Image
              # ==================================================
              echo "Building backend image..."

              docker build \
                --build-arg BUILD_DATE="$BUILD_DATE" \
                --build-arg VERSION="$VERSION" \
                -t "$BACKEND_IMAGE:$VERSION" \
                ./backend

              # ==================================================
              # Build Frontend Image
              # ==================================================
              echo "Building frontend image..."

              docker build \
                --build-arg BUILD_DATE="$BUILD_DATE" \
                --build-arg VERSION="$VERSION" \
                -t "$FRONTEND_IMAGE:$VERSION" \
                ./frontend

              # ==================================================
              # Verify Images
              # ==================================================
              echo ""
              echo "=========================================="
              echo "Verifying Docker images"
              echo "=========================================="

              docker image inspect "$BACKEND_IMAGE:$VERSION" > /dev/null
              docker image inspect "$FRONTEND_IMAGE:$VERSION" > /dev/null

              docker images | grep "shopnestacr.azurecr.io/shopnest-"

              # ==================================================
              # Save Exact Images for Security Scanning
              # ==================================================
              echo ""
              echo "=========================================="
              echo "Saving Docker images for Trivy scan"
              echo "=========================================="

              mkdir -p "$(Build.ArtifactStagingDirectory)/docker-images"

              docker save \
                "$BACKEND_IMAGE:$VERSION" \
                -o "$(Build.ArtifactStagingDirectory)/docker-images/shopnest-backend.tar"

              docker save \
                "$FRONTEND_IMAGE:$VERSION" \
                -o "$(Build.ArtifactStagingDirectory)/docker-images/shopnest-frontend.tar"

              # ==================================================
              # Verify Saved Artifacts
              # ==================================================
              echo ""
              echo "=========================================="
              echo "Docker image artifacts"
              echo "=========================================="

              ls -lh "$(Build.ArtifactStagingDirectory)/docker-images"

              echo ""
              echo "Docker images successfully built and saved."
            displayName: "Build and Save Docker Images"

          # ======================================================
          # Publish exact Docker images for the SecurityScan stage
          # ======================================================
          - task: PublishPipelineArtifact@1
            displayName: "Publish Docker Images"
            inputs:
              targetPath: "$(Build.ArtifactStagingDirectory)/docker-images"
              artifact: "docker-images"
              publishLocation: "pipeline"

  # ============================================================
  # Stage 5: Container Security Scan - Trivy
  # ============================================================
  - stage: SecurityScan
    displayName: "Trivy Container Security Scan"

    dependsOn: DockerBuild
    condition: succeeded()

    jobs:
      - job: TrivyScan
        displayName: "Scan Docker Images for Vulnerabilities"

        steps:

          - checkout: none

          # ----------------------------------------------------
          # Download Docker image artifacts
          # ----------------------------------------------------
          - task: DownloadPipelineArtifact@2
            displayName: "Download Docker Images"
            inputs:
              artifact: docker-images
              path: "$(Pipeline.Workspace)/docker-images"

          # ----------------------------------------------------
          # Load Docker images into the Docker daemon
          # ----------------------------------------------------
          - script: |
              set -e

              echo "Loading backend Docker image..."
              docker load \
                -i "$(Pipeline.Workspace)/docker-images/shopnest-backend.tar"

              echo "Loading frontend Docker image..."
              docker load \
                -i "$(Pipeline.Workspace)/docker-images/shopnest-frontend.tar"

              echo ""
              echo "Loaded Docker images:"
              docker images | grep "shopnestacr.azurecr.io/shopnest-"
            displayName: "Load Docker Images"

          # ----------------------------------------------------
          # Install Trivy
          # ----------------------------------------------------
          - script: |
              set -e

              echo "Installing Trivy..."

              sudo apt-get update
              sudo apt-get install -y wget apt-transport-https gnupg lsb-release

              wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
                | gpg --dearmor \
                | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

              echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
                https://aquasecurity.github.io/trivy-repo/deb \
                $(lsb_release -sc) main" \
                | sudo tee /etc/apt/sources.list.d/trivy.list

              sudo apt-get update
              sudo apt-get install -y trivy

              trivy --version
            displayName: "Install Trivy"

          # ----------------------------------------------------
          # Scan Backend
          # ----------------------------------------------------
          - script: |
              set -e

              VERSION="1.0.$(Build.BuildId)"
              BACKEND_IMAGE="shopnestacr.azurecr.io/shopnest-backend:$VERSION"

              echo "================================================"
              echo "Scanning Backend Image"
              echo "Image: $BACKEND_IMAGE"
              echo "================================================"

              trivy image \
                --exit-code 1 \
                --severity CRITICAL \
                --no-progress \
                --timeout 5m \
                --ignore-unfixed \
                "$BACKEND_IMAGE"

            displayName: "Trivy Scan - Backend"

          # ----------------------------------------------------
          # Scan Frontend
          # ----------------------------------------------------
          - script: |
              set -e

              VERSION="1.0.$(Build.BuildId)"
              FRONTEND_IMAGE="shopnestacr.azurecr.io/shopnest-frontend:$VERSION"

              echo "================================================"
              echo "Scanning Frontend Image"
              echo "Image: $FRONTEND_IMAGE"
              echo "================================================"

              trivy image \
                --exit-code 1 \
                --severity CRITICAL \
                --no-progress \
                --timeout 5m \
                --ignore-unfixed \
                "$FRONTEND_IMAGE"

            displayName: "Trivy Scan - Frontend"

  # ============================================================
  # Stage 6: Push Images to ACR
  # ============================================================
  - stage: PushToACR
    displayName: "Push Docker Images to ACR"

    dependsOn: SecurityScan
    condition: succeeded()

    jobs:
      - job: PushImages
        displayName: "Push Approved Docker Images"

        steps:

          # ----------------------------------------------------
          # Download the EXACT images that were built and scanned
          # ----------------------------------------------------
          - task: DownloadPipelineArtifact@2
            displayName: "Download Scanned Docker Images"
            inputs:
              artifact: docker-images
              path: "$(Pipeline.Workspace)/docker-images"

          # ----------------------------------------------------
          # Load images into Docker
          # ----------------------------------------------------
          - script: |
              set -euo pipefail

              echo "=============================================="
              echo "Downloaded artifact contents"
              echo "=============================================="

              find "$(Pipeline.Workspace)" -maxdepth 4 -type f -print

              echo "=============================================="
              echo "Docker image files"
              echo "=============================================="

              find "$(Pipeline.Workspace)" -type f \( -name "*.tar" -o -name "*.tar.gz" \) -print

              BACKEND_TAR=$(find "$(Pipeline.Workspace)" -type f -name "shopnest-backend.tar" -print -quit)
              FRONTEND_TAR=$(find "$(Pipeline.Workspace)" -type f -name "shopnest-frontend.tar" -print -quit)

              if [ -z "$BACKEND_TAR" ]; then
                echo "ERROR: backend.tar was not found."
                exit 1
              fi

              if [ -z "$FRONTEND_TAR" ]; then
                echo "ERROR: frontend.tar was not found."
                exit 1
              fi

              echo "Backend image artifact:"
              echo "$BACKEND_TAR"

              echo "Frontend image artifact:"
              echo "$FRONTEND_TAR"

              echo "=============================================="
              echo "Loading Backend Image"
              echo "=============================================="

              docker load --input "$BACKEND_TAR"

              echo "=============================================="
              echo "Loading Frontend Image"
              echo "=============================================="

              docker load --input "$FRONTEND_TAR"

              echo "=============================================="
              echo "Loaded Docker Images"
              echo "=============================================="

              docker images | grep "shopnestacr.azurecr.io/shopnest-"

            displayName: "Load Docker Images"

          # ----------------------------------------------------
          # Authenticate using Azure OIDC
          # ----------------------------------------------------
          - task: AzureCLI@2
            displayName: "Login to Azure and Push Images"
            inputs:
              azureSubscription: "sc-shopnest-azure"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -euo pipefail

                VERSION="1.0.$(Build.BuildId)"
                ACR_NAME="shopnestacr"
                ACR_LOGIN_SERVER="${ACR_NAME}.azurecr.io"

                BACKEND_IMAGE="${ACR_LOGIN_SERVER}/shopnest-backend:${VERSION}"
                FRONTEND_IMAGE="${ACR_LOGIN_SERVER}/shopnest-frontend:${VERSION}"

                echo "=============================================="
                echo "Authenticating to Azure Container Registry"
                echo "=============================================="

                az acr login --name "$ACR_NAME"

                echo "=============================================="
                echo "Pushing Backend Image"
                echo "=============================================="

                docker push "$BACKEND_IMAGE"

                echo "=============================================="
                echo "Pushing Frontend Image"
                echo "=============================================="

                docker push "$FRONTEND_IMAGE"

                echo "=============================================="
                echo "Images pushed successfully"
                echo "=============================================="

                echo "$BACKEND_IMAGE"
                echo "$FRONTEND_IMAGE"

  # ============================================================
  # Stage 7: Deploy to AKS
  # ============================================================
  - stage: DeployToAKS
    displayName: "Deploy to AKS"

    dependsOn: PushToACR
    condition: succeeded()

    jobs:
      - job: Deploy
        displayName: "Helm Deploy to AKS"

        steps:

          - checkout: self
            displayName: "Checkout Source Code"

          # ----------------------------------------------------
          # Authenticate to Azure using the existing OIDC
          # service connection and install kubelogin
          # ----------------------------------------------------
          - task: AzureCLI@2
            displayName: "Authenticate to Azure (OIDC) and Install kubelogin"
            inputs:
              azureSubscription: "sc-shopnest-azure"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -euo pipefail

                az account show --output table

                echo "=============================================="
                echo "Installing kubectl and kubelogin"
                echo "=============================================="

                # Install kubectl
                sudo az aks install-cli

                # Install kubelogin (kubelogin authenticates against
                # AKS that has local accounts disabled, using AAD)
                if ! command -v kubelogin >/dev/null 2>&1; then
                  KUBELOGIN_VERSION=$(curl -s \
                    "https://api.github.com/repos/Azure/kubelogin/releases/latest" \
                    | grep '"tag_name"' | cut -d '"' -f 4)
                  echo "Installing kubelogin $KUBELOGIN_VERSION"
                  wget -q \
                    "https://github.com/Azure/kubelogin/releases/download/${KUBELOGIN_VERSION}/kubelogin-linux-amd64.zip" \
                    -O /tmp/kubelogin.zip
                  sudo unzip -o /tmp/kubelogin.zip -d /usr/local/bin
                  sudo chmod +x /usr/local/bin/kubelogin
                  rm -f /tmp/kubelogin.zip
                fi

                kubectl version --client
                kubelogin version

          # ----------------------------------------------------
          # Get AKS credentials and verify cluster connectivity
          # ----------------------------------------------------
          - task: AzureCLI@2
            displayName: "Get AKS Credentials and Verify Cluster"
            inputs:
              azureSubscription: "sc-shopnest-azure"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -euo pipefail

                RESOURCE_GROUP="shopnest-dev-rg"
                CLUSTER_NAME="shopnest-dev-aks"
                NAMESPACE="shopnest"

                echo "=============================================="
                echo "Getting AKS credentials for ${CLUSTER_NAME}"
                echo "=============================================="

                # Get credentials and force kubelogin-based auth
                # (required because local accounts are disabled)
                az aks get-credentials \
                --resource-group "$RESOURCE_GROUP" \
                --name "$CLUSTER_NAME" \
                --overwrite-existing

                kubelogin convert-kubeconfig -l azurecli

                # Ensure the kubelogin interceptor is used
                KUBECONFIG="$HOME/.kube/config"
                if ! grep -q "kubelogin" "$KUBECONFIG"; then
                  echo "kubelogin not configured in kubeconfig, adding executor..."
                  # Verify the pluggable exec is present after forcing credential mode
                  kubelogin convert-kubeconfig -l azurecli
                fi

                # Verify connectivity
                echo "Clusters available:"
                kubectl config get-contexts
                echo ""
                echo "Cluster nodes:"
                kubectl get nodes -o wide

                # Verify target namespace exists
                if kubectl get namespace "$NAMESPACE" >/dev/null 2>&1; then
                  echo "Namespace '$NAMESPACE' exists."
                else
                  echo "Namespace '$NAMESPACE' does not exist. Skipping (will be managed by Helm/ArgoCD)."
                fi

          # ----------------------------------------------------
          # Deploy / upgrade the Helm chart with values-azure.yaml
          # ----------------------------------------------------
          - task: AzureCLI@2
            displayName: "Helm Deploy to AKS"
            inputs:
              azureSubscription: "sc-shopnest-azure"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -euo pipefail

                RESOURCE_GROUP="shopnest-dev-rg"
                CLUSTER_NAME="shopnest-dev-aks"
                NAMESPACE="shopnest"
                VERSION="1.0.$(Build.BuildId)"

                az aks get-credentials \
                --resource-group "$RESOURCE_GROUP" \
                --name "$CLUSTER_NAME" \
                --overwrite-existing

                kubelogin convert-kubeconfig -l azurecli

                # Ensure the kubeconfig uses kubelogin AAD auth
                if ! kubelogin convert-kubeconfig -l azurecli >/dev/null 2>&1; then
                  echo "kubelogin convert-kubeconfig already applied or not needed"
                fi

                # Ensure the namespace exists
                kubectl get namespace "$NAMESPACE" >/dev/null 2>&1 || \
                  kubectl create namespace "$NAMESPACE"

                echo "=============================================="
                echo "Deploying ShopNest Helm chart (version $VERSION)"
                echo "=============================================="

                helm dependency build ./helm/shopnest || true

                # The backend identity's client ID is a generated UUID that
                # changes whenever Terraform recreates it, so it's never
                # committed to a values file — fetched live by its
                # deterministic name instead.
                BACKEND_IDENTITY_CLIENT_ID=$(az identity show \
                  --resource-group "$RESOURCE_GROUP" \
                  --name "shopnest-dev-backend-identity" \
                  --query clientId -o tsv)

                helm upgrade --install shopnest ./helm/shopnest \
                  --namespace "$NAMESPACE" \
                  --create-namespace \
                  --values ./helm/shopnest/values-azure.yaml \
                  --values ./helm/shopnest/environments/azure/dev.yaml \
                  --set backend.image.tag="$VERSION" \
                  --set frontend.image.tag="$VERSION" \
                  --set workloadIdentity.clientId="$BACKEND_IDENTITY_CLIENT_ID" \
                  --wait \
                  --timeout 10m

                echo ""
                echo "Helm release status:"
                helm status shopnest --namespace "$NAMESPACE"

          # ----------------------------------------------------
          # Wait for rollout to complete (fails if not healthy)
          # ----------------------------------------------------
          - task: AzureCLI@2
            displayName: "Wait for Deployment Rollouts"
            inputs:
              azureSubscription: "sc-shopnest-azure"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -euo pipefail

                RESOURCE_GROUP="shopnest-dev-rg"
                CLUSTER_NAME="shopnest-dev-aks"
                NAMESPACE="shopnest"

                az aks get-credentials \
                --resource-group "$RESOURCE_GROUP" \
                --name "$CLUSTER_NAME" \
                --overwrite-existing

                kubelogin convert-kubeconfig -l azurecli

                kubelogin convert-kubeconfig -l azurecli >/dev/null 2>&1 || true

                echo "=============================================="
                echo "Waiting for backend rollout to complete"
                echo "=============================================="

                # Exit non-zero on failure, which fails the pipeline
                kubectl rollout status deployment/shopnest-backend \
                  --namespace "$NAMESPACE" \
                  --timeout=300s

                echo "=============================================="
                echo "Waiting for frontend rollout to complete"
                echo "=============================================="

                kubectl rollout status deployment/shopnest-frontend \
                  --namespace "$NAMESPACE" \
                  --timeout=300s

                echo ""
                echo "Both deployments rolled out successfully."

          # ----------------------------------------------------
          # Verify deployment health (pods, replicas, readiness)
          # ----------------------------------------------------
          - task: AzureCLI@2
            displayName: "Verify Deployment Health"
            inputs:
              azureSubscription: "sc-shopnest-azure"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -euo pipefail

                RESOURCE_GROUP="shopnest-dev-rg"
                CLUSTER_NAME="shopnest-dev-aks"
                NAMESPACE="shopnest"

                az aks get-credentials \
                --resource-group "$RESOURCE_GROUP" \
                --name "$CLUSTER_NAME" \
                --overwrite-existing

                kubelogin convert-kubeconfig -l azurecli

                kubelogin convert-kubeconfig -l azurecli >/dev/null 2>&1 || true

                echo "=============================================="
                echo "Deployments"
                echo "=============================================="
                kubectl get deployments -n "$NAMESPACE"

                echo ""
                echo "Checking deployment availability..."
                for DEPLOYMENT in shopnest-backend shopnest-frontend; do
                  AVAILABLE=$(kubectl get deployment "$DEPLOYMENT" \
                    -n "$NAMESPACE" \
                    -o jsonpath='{.status.availableReplicas}')
                  DESIRED=$(kubectl get deployment "$DEPLOYMENT" \
                    -n "$NAMESPACE" \
                    -o jsonpath='{.spec.replicas}')

                  echo "${DEPLOYMENT}: available=$AVAILABLE desired=$DESIRED"

                  if [ "${AVAILABLE:-0}" -lt "${DESIRED:-1}" ]; then
                    echo "ERROR: $DEPLOYMENT is not healthy (available=$AVAILABLE, desired=$DESIRED)"
                    exit 1
                  fi
                done

                echo ""
                echo "=============================================="
                echo "Pods"
                echo "=============================================="
                kubectl get pods -n "$NAMESPACE" -o wide

                echo ""
                echo "Checking pod readiness..."
                NOT_READY=$(kubectl get pods -n "$NAMESPACE" \
                  --field-selector=status.phase=Running \
                  -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.containerStatuses[*].ready}{"\n"}{end}' \
                  | grep -c "false" || true)

                if [ "$NOT_READY" -gt 0 ]; then
                  echo "ERROR: $NOT_READY pod(s) are not ready."
                  exit 1
                fi

                echo ""
                echo "=============================================="
                echo "Services"
                echo "=============================================="
                kubectl get svc -n "$NAMESPACE"

                echo ""
                echo "=============================================="
                echo "Ingress"
                echo "=============================================="
                kubectl get ingress -n "$NAMESPACE"

                echo ""
                echo "=============================================="
                echo "Service endpoints (backing pods)"
                echo "=============================================="

                # Confirm the services have ready backend pods behind
                # them. This verifies application connectivity without
                # provisioning any additional capacity.
                for SVC in backend shopnest-frontend; do
                  ENDPOINT_COUNT=$(kubectl get endpoints "$SVC" \
                    -n "$NAMESPACE" \
                    -o jsonpath='{.subsets[0].addresses}' \
                    | tr ',' '\n' | grep -c . || true)

                  echo "${SVC}: ready endpoints=$ENDPOINT_COUNT"

                  if [ "${ENDPOINT_COUNT:-0}" -lt 1 ]; then
                    echo "ERROR: Service $SVC has no ready endpoints."
                    exit 1
                  fi
                done

                echo ""
                echo "=============================================="
                echo "Application health check (via readiness/liveness)"
                echo "=============================================="

                # The readiness/liveness probes already hit /health on
                # every replica; the rollout + availability + pod
                # readiness checks above confirm the application is
                # serving healthy responses. Re-assert final state:
                kubectl get events \
                  --namespace "$NAMESPACE" \
                  --field-selector type=Warning \
                  --sort-by=.lastTimestamp \
                  | tail -20 || true

                echo ""
                echo "Deployment health verification passed."