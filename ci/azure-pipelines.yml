trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:

  - stage: Test
    displayName: "Run Tests"

    jobs:
      - job: BackendTests
        displayName: "Backend Tests"

        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: "Install Node.js"
            inputs:
              versionSpec: "20.x"

          - script: |
              cd backend
              npm ci
              npm test
            displayName: "Run backend tests"