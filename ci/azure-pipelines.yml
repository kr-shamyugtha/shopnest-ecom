trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

stages:

  # ============================================================
  # Stage 1: Test
  # ============================================================
  - stage: Test
    displayName: "Run Tests"

    jobs:

      - job: ApplicationTests
        displayName: "Backend and Frontend Tests"

        steps:

          - checkout: self
            displayName: "Checkout Source Code"

          - task: UseNode@1
            displayName: "Install Node.js"
            inputs:
              version: "20.x"

          - script: |
              cd backend
              npm ci
              npm test -- --ci
            displayName: "Run Backend Tests"

          - script: |
              cd frontend
              npm ci
              npm test -- --watchAll=false
            displayName: "Run Frontend Tests"


  # ============================================================
  # Stage 2: Build
  # ============================================================
  - stage: Build
    displayName: "Build Application"

    dependsOn: Test
    condition: succeeded()

    jobs:

      - job: ApplicationBuild
        displayName: "Build Frontend"

        steps:

          - checkout: self
            displayName: "Checkout Source Code"

          - task: UseNode@1
            displayName: "Install Node.js"
            inputs:
              version: "20.x"

          - script: |
              cd backend
              npm ci
            displayName: "Install Backend Dependencies"

          - script: |
              cd frontend
              npm ci
              npm run build
            displayName: "Build Frontend"
            
  # ============================================================
  # Stage 3: SonarCloud Code Quality
  # ============================================================
  - stage: CodeQuality
    displayName: "SonarCloud Code Quality"

    dependsOn: Build
    condition: succeeded()

    jobs:
    - job: SonarCloudAnalysis
      displayName: "SonarCloud Analysis"

      steps:
        - checkout: self

        - task: SonarCloudPrepare@3
          displayName: "Prepare SonarCloud Analysis"
          inputs:
            SonarCloud: "SonarCloud-ShopNest"
            organization: "kr-shamyugtha"
            scannerMode: "CLI"
            configMode: "file"

        - task: SonarCloudAnalyze@3
          displayName: "Run SonarCloud Analysis"

        - task: SonarCloudPublish@3
          displayName: "Publish SonarCloud Quality Gate"
          inputs:
            pollingTimeoutSec: "300"

  # ============================================================
  # Stage 4: Docker Build
  # ============================================================
  - stage: DockerBuild
    displayName: "Build Docker Images"

    dependsOn: CodeQuality
    condition: succeeded()

    jobs:
      - job: BuildImages
        displayName: "Build Backend and Frontend Images"

        steps:
          - checkout: self
            displayName: "Checkout Source Code"

          - script: |
              set -e

              BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
              VERSION="1.0.$(Build.BuildId)"

              BACKEND_IMAGE="shopnestacr.azurecr.io/shopnest-backend"
              FRONTEND_IMAGE="shopnestacr.azurecr.io/shopnest-frontend"

              echo "=========================================="
              echo "Building ShopNest Docker images"
              echo "=========================================="
              echo "Version: $VERSION"
              echo "Build Date: $BUILD_DATE"
              echo ""

              # ==================================================
              # Build Backend Image
              # ==================================================
              echo "Building backend image..."

              docker build \
                --build-arg BUILD_DATE="$BUILD_DATE" \
                --build-arg VERSION="$VERSION" \
                -t "$BACKEND_IMAGE:$VERSION" \
                ./backend

              # ==================================================
              # Build Frontend Image
              # ==================================================
              echo "Building frontend image..."

              docker build \
                --build-arg BUILD_DATE="$BUILD_DATE" \
                --build-arg VERSION="$VERSION" \
                -t "$FRONTEND_IMAGE:$VERSION" \
                ./frontend

              # ==================================================
              # Verify Images
              # ==================================================
              echo ""
              echo "=========================================="
              echo "Verifying Docker images"
              echo "=========================================="

              docker image inspect "$BACKEND_IMAGE:$VERSION" > /dev/null
              docker image inspect "$FRONTEND_IMAGE:$VERSION" > /dev/null

              docker images | grep "shopnestacr.azurecr.io/shopnest-"

              # ==================================================
              # Save Exact Images for Security Scanning
              # ==================================================
              echo ""
              echo "=========================================="
              echo "Saving Docker images for Trivy scan"
              echo "=========================================="

              mkdir -p "$(Build.ArtifactStagingDirectory)/docker-images"

              docker save \
                "$BACKEND_IMAGE:$VERSION" \
                -o "$(Build.ArtifactStagingDirectory)/docker-images/shopnest-backend.tar"

              docker save \
                "$FRONTEND_IMAGE:$VERSION" \
                -o "$(Build.ArtifactStagingDirectory)/docker-images/shopnest-frontend.tar"

              # ==================================================
              # Verify Saved Artifacts
              # ==================================================
              echo ""
              echo "=========================================="
              echo "Docker image artifacts"
              echo "=========================================="

              ls -lh "$(Build.ArtifactStagingDirectory)/docker-images"

              echo ""
              echo "Docker images successfully built and saved."
            displayName: "Build and Save Docker Images"

          # ======================================================
          # Publish exact Docker images for the SecurityScan stage
          # ======================================================
          - task: PublishPipelineArtifact@1
            displayName: "Publish Docker Images"
            inputs:
              targetPath: "$(Build.ArtifactStagingDirectory)/docker-images"
              artifact: "docker-images"
              publishLocation: "pipeline"

  # ============================================================
  # Stage 5: Container Security Scan - Trivy
  # ============================================================
  - stage: SecurityScan
    displayName: "Trivy Container Security Scan"

    dependsOn: DockerBuild
    condition: succeeded()

    jobs:
      - job: TrivyScan
        displayName: "Scan Docker Images for Vulnerabilities"

        steps:

          - checkout: none

          # ----------------------------------------------------
          # Download Docker image artifacts
          # ----------------------------------------------------
          - task: DownloadPipelineArtifact@2
            displayName: "Download Docker Images"
            inputs:
              artifact: docker-images
              path: "$(Pipeline.Workspace)/docker-images"

          # ----------------------------------------------------
          # Load Docker images into the Docker daemon
          # ----------------------------------------------------
          - script: |
              set -e

              echo "Loading backend Docker image..."
              docker load \
                -i "$(Pipeline.Workspace)/docker-images/shopnest-backend.tar"

              echo "Loading frontend Docker image..."
              docker load \
                -i "$(Pipeline.Workspace)/docker-images/shopnest-frontend.tar"

              echo ""
              echo "Loaded Docker images:"
              docker images | grep "shopnestacr.azurecr.io/shopnest-"
            displayName: "Load Docker Images"

          # ----------------------------------------------------
          # Install Trivy
          # ----------------------------------------------------
          - script: |
              set -e

              echo "Installing Trivy..."

              sudo apt-get update
              sudo apt-get install -y wget apt-transport-https gnupg lsb-release

              wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
                | gpg --dearmor \
                | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

              echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
                https://aquasecurity.github.io/trivy-repo/deb \
                $(lsb_release -sc) main" \
                | sudo tee /etc/apt/sources.list.d/trivy.list

              sudo apt-get update
              sudo apt-get install -y trivy

              trivy --version
            displayName: "Install Trivy"

          # ----------------------------------------------------
          # Scan Backend
          # ----------------------------------------------------
          - script: |
              set -e

              VERSION="1.0.$(Build.BuildId)"
              BACKEND_IMAGE="shopnestacr.azurecr.io/shopnest-backend:$VERSION"

              echo "================================================"
              echo "Scanning Backend Image"
              echo "Image: $BACKEND_IMAGE"
              echo "================================================"

              trivy image \
                --exit-code 1 \
                --severity CRITICAL \
                --no-progress \
                --timeout 5m \
                --ignore-unfixed \
                "$BACKEND_IMAGE"

            displayName: "Trivy Scan - Backend"

          # ----------------------------------------------------
          # Scan Frontend
          # ----------------------------------------------------
          - script: |
              set -e

              VERSION="1.0.$(Build.BuildId)"
              FRONTEND_IMAGE="shopnestacr.azurecr.io/shopnest-frontend:$VERSION"

              echo "================================================"
              echo "Scanning Frontend Image"
              echo "Image: $FRONTEND_IMAGE"
              echo "================================================"

              trivy image \
                --exit-code 1 \
                --severity CRITICAL \
                --no-progress \
                --timeout 5m \
                --ignore-unfixed \
                "$FRONTEND_IMAGE"

            displayName: "Trivy Scan - Frontend"

  # ============================================================
  # Stage 6: Push Images to ACR
  # ============================================================
  - stage: PushToACR
    displayName: "Push Docker Images to ACR"

    dependsOn: SecurityScan
    condition: succeeded()

    jobs:
      - job: PushImages
        displayName: "Push Approved Docker Images"

        steps:

          # ----------------------------------------------------
          # Download the EXACT images that were built and scanned
          # ----------------------------------------------------
          - task: DownloadPipelineArtifact@2
            displayName: "Download Scanned Docker Images"
            inputs:
              artifact: docker-images
              path: "$(Pipeline.Workspace)/docker-images"

          # ----------------------------------------------------
          # Load images into Docker
          # ----------------------------------------------------
          - script: |
              set -euo pipefail

              echo "=============================================="
              echo "Downloaded artifact contents"
              echo "=============================================="

              find "$(Pipeline.Workspace)" -maxdepth 4 -type f -print

              echo "=============================================="
              echo "Docker image files"
              echo "=============================================="

              find "$(Pipeline.Workspace)" -type f \( -name "*.tar" -o -name "*.tar.gz" \) -print

              BACKEND_TAR=$(find "$(Pipeline.Workspace)" -type f -name "shopnest-backend.tar" -print -quit)
              FRONTEND_TAR=$(find "$(Pipeline.Workspace)" -type f -name "shopnest-frontend.tar" -print -quit)

              if [ -z "$BACKEND_TAR" ]; then
                echo "ERROR: backend.tar was not found."
                exit 1
              fi

              if [ -z "$FRONTEND_TAR" ]; then
                echo "ERROR: frontend.tar was not found."
                exit 1
              fi

              echo "Backend image artifact:"
              echo "$BACKEND_TAR"

              echo "Frontend image artifact:"
              echo "$FRONTEND_TAR"

              echo "=============================================="
              echo "Loading Backend Image"
              echo "=============================================="

              docker load --input "$BACKEND_TAR"

              echo "=============================================="
              echo "Loading Frontend Image"
              echo "=============================================="

              docker load --input "$FRONTEND_TAR"

              echo "=============================================="
              echo "Loaded Docker Images"
              echo "=============================================="

              docker images | grep "shopnestacr.azurecr.io/shopnest-"

            displayName: "Load Docker Images"

          # ----------------------------------------------------
          # Authenticate using Azure OIDC
          # ----------------------------------------------------
          - task: AzureCLI@2
            displayName: "Login to Azure and Push Images"
            inputs:
              azureSubscription: "sc-shopnest-azure"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -euo pipefail

                VERSION="1.0.$(Build.BuildId)"
                ACR_NAME="shopnestacr"
                ACR_LOGIN_SERVER="${ACR_NAME}.azurecr.io"

                BACKEND_IMAGE="${ACR_LOGIN_SERVER}/shopnest-backend:${VERSION}"
                FRONTEND_IMAGE="${ACR_LOGIN_SERVER}/shopnest-frontend:${VERSION}"

                echo "=============================================="
                echo "Authenticating to Azure Container Registry"
                echo "=============================================="

                az acr login --name "$ACR_NAME"

                echo "=============================================="
                echo "Pushing Backend Image"
                echo "=============================================="

                docker push "$BACKEND_IMAGE"

                echo "=============================================="
                echo "Pushing Frontend Image"
                echo "=============================================="

                docker push "$FRONTEND_IMAGE"

                echo "=============================================="
                echo "Images pushed successfully"
                echo "=============================================="

                echo "$BACKEND_IMAGE"
                echo "$FRONTEND_IMAGE"

  # ============================================================
  # Stage 7: Update GitOps config (Argo CD deploys, not this pipeline)
  # ============================================================
  - stage: DeployToAKS
    displayName: "Update GitOps Config for AKS"

    dependsOn: PushToACR
    condition: succeeded()

    jobs:
      - job: UpdateGitOpsConfig
        displayName: "Commit New Image Tag to GitOps Config"

        steps:

          - checkout: self
            displayName: "Checkout Source Code"
            persistCredentials: true

          # ----------------------------------------------------
          # Fetch the backend identity's client ID. It's a generated
          # UUID that changes whenever Terraform recreates the identity,
          # so it's read live rather than hardcoded here — but unlike the
          # old direct-helm-upgrade approach, it gets written into the
          # committed GitOps config below, not passed as an ephemeral
          # --set flag. Argo CD has no equivalent of --set: only what's
          # in Git is ever applied.
          # ----------------------------------------------------
          - task: AzureCLI@2
            displayName: "Fetch Backend Identity Client ID"
            inputs:
              azureSubscription: "sc-shopnest-azure"
              scriptType: "bash"
              scriptLocation: "inlineScript"
              inlineScript: |
                set -euo pipefail

                BACKEND_IDENTITY_CLIENT_ID=$(az identity show \
                  --resource-group "shopnest-dev-rg" \
                  --name "shopnest-dev-backend-identity" \
                  --query clientId -o tsv)

                echo "##vso[task.setvariable variable=BACKEND_IDENTITY_CLIENT_ID]$BACKEND_IDENTITY_CLIENT_ID"

          # ----------------------------------------------------
          # Update the GitOps config and push. This is the pipeline's
          # entire job now — it never touches the cluster directly.
          # Argo CD, watching this file, picks up the commit and
          # reconciles automatically (syncPolicy.automated is on).
          # ----------------------------------------------------
          - script: |
              set -euo pipefail

              VERSION="1.0.$(Build.BuildId)"
              CONFIG_FILE="helm/shopnest/environments/azure/dev.yaml"

              echo "=============================================="
              echo "Installing yq"
              echo "=============================================="
              sudo wget -q "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64" -O /usr/local/bin/yq
              sudo chmod +x /usr/local/bin/yq
              yq --version

              echo "=============================================="
              echo "Updating $CONFIG_FILE (version $VERSION)"
              echo "=============================================="

              yq -i ".backend.image.tag = \"$VERSION\"" "$CONFIG_FILE"
              yq -i ".frontend.image.tag = \"$VERSION\"" "$CONFIG_FILE"
              yq -i ".workloadIdentity.clientId = \"$(BACKEND_IDENTITY_CLIENT_ID)\"" "$CONFIG_FILE"

              cat "$CONFIG_FILE"

              git config user.name "Azure Pipelines"
              git config user.email "azure-pipelines@shopnest.local"
              git add "$CONFIG_FILE"

              if git diff --cached --quiet; then
                echo "No changes to commit — config already matches this version."
                exit 0
              fi

              git commit -m "ci: bump dev image tag to $VERSION [skip ci]"
              git push origin HEAD:main
            displayName: "Update GitOps Config and Push"