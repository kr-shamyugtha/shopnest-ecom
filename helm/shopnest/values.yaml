backend:
  image:
    repository: ""
    tag: v2

  replicas: 2
  port: 5000

  config:
    port: "5000"
    nodeEnv: "production"
    frontendUrl: ""

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

frontend:
  image:
    repository: ""
    tag: v2

  replicas: 2
  port: 8080

  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

  razorpayKeyId: ""

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

ingress:
  # Empty by default — an Ingress rule with no host matches any host, which
  # is the correct default until an environment has a real hostname to set.
  host: ""
  tls:
    enabled: false
    clusterIssuer: selfsigned-issuer

cloud:
  provider: azure

secrets:
  enabled: false
  providerClassName: shopnest-backend
  k8sSecretName: shopnest-backend-secret
  items:
    - key: CLOUDINARY_API_KEY
      name: CLOUDINARY-API-KEY
    - key: CLOUDINARY_API_SECRET
      name: CLOUDINARY-API-SECRET
    - key: CLOUDINARY_CLOUD_NAME
      name: CLOUDINARY-CLOUD-NAME
    - key: GMAIL_PASS
      name: GMAIL-PASS
    - key: GMAIL_USER
      name: GMAIL-USER
    - key: JWT_SECRET
      name: JWT-SECRET
    - key: MONGO_URI
      name: MONGO-URI
    - key: RAZORPAY_KEY_ID
      name: RAZORPAY-KEY-ID
    - key: RAZORPAY_KEY_SECRET
      name: RAZORPAY-KEY-SECRET

workloadIdentity:
  enabled: false
  serviceAccountName: shopnest-backend
  clientId: ""
# ----------------------------------------------------------------------
# Monitoring
#
# The ServiceMonitor is a separate CRD from the workload itself, so it is
# gated independently: a cluster without the Prometheus Operator installed
# has no ServiceMonitor CRD, and syncing one there fails the whole release.
# ----------------------------------------------------------------------
monitoring:
  serviceMonitor:
    enabled: true
