cloud:
  provider: azure

backend:
  image:
    repository: shopnestacr2026.azurecr.io/shopnest-backend

  config:
    port: "5000"
    nodeEnv: "production"
    frontendUrl: ""

frontend:
  image:
    repository: shopnestacr2026.azurecr.io/shopnest-frontend

secrets:
  enabled: true
  providerClassName: shopnest-backend

  azure:
    tenantId: "1734f897-f9d3-41eb-a30c-60d092d8a5d8"

workloadIdentity:
  enabled: true
  serviceAccountName: shopnest-backend
  # clientId intentionally not set here — it's a generated UUID that changes
  # whenever Terraform recreates the backend identity, so it's supplied at
  # deploy time via `--set` (fetched live via `az identity show`, see
  # ci/azure-pipelines.yml) rather than committed to any values file.
