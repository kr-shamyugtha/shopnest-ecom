cloud:
  provider: azure

backend:
  image:
    repository: shopnestacr2026.azurecr.io/shopnest-backend

  config:
    port: "5000"
    nodeEnv: "production"
    frontendUrl: ""

frontend:
  image:
    repository: shopnestacr2026.azurecr.io/shopnest-frontend

secrets:
  enabled: true
  providerClassName: shopnest-backend

  azure:
    tenantId: "1734f897-f9d3-41eb-a30c-60d092d8a5d8"

workloadIdentity:
  enabled: true
  serviceAccountName: shopnest-backend
  # clientId intentionally not set here — it's a generated UUID that's
  # different per environment and changes whenever Terraform recreates the
  # backend identity. It lives in environments/azure/<env>.yaml instead;
  # for dev, the DeployToAKS stage of ci/azure-pipelines.yml fetches it live
  # (`az identity show`) and commits it there alongside the image tag.
