backend:
  image:
    tag: "1.0.6"
    repository: 700558813872.dkr.ecr.ap-southeast-2.amazonaws.com/shopnest/shopnest-backend
  # Same constraint as the Azure dev cluster: two m7i-flex.large nodes (2 vCPU
  # each) already carry Argo CD, the monitoring stack and, unlike AKS, the
  # add-ons AWS does not manage for you (load balancer controller,
  # metrics-server, cluster-autoscaler, the CSI driver pair). 1 replica is
  # enough for a dev/demo environment.
  autoscaling:
    minReplicas: 1
frontend:
  image:
    tag: "1.0.6"
    repository: 700558813872.dkr.ecr.ap-southeast-2.amazonaws.com/shopnest/shopnest-frontend
  razorpayKeyId: "rzp_test_TOpPJJoN5F2yHB"
  autoscaling:
    minReplicas: 1
secrets:
  aws:
    region: "ap-southeast-2"
    secretPrefix: "shopnest/dev"
# Only changes when Terraform recreates the backend role (rare) — safe to
# commit directly (it's an identifier, not a secret) rather than relying on
# a live `--set` at deploy time, which Argo CD's GitOps flow has no
# equivalent for. The pipeline rewrites this value on every run.
workloadIdentity:
  roleArn: "arn:aws:iam::700558813872:role/shopnest-dev-backend"
ingress:
  # Fill in once ingress-nginx is applied and the NLB's DNS name is known.
  # An NLB gets a hostname, not an IP, so the nip.io trick the Azure dev
  # environment used does not apply — use the
  # <name>.elb.<region>.amazonaws.com name directly, or leave empty to match
  # any host.
  host: ""
  tls:
    enabled: false
