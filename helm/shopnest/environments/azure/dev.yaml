backend:
  image:
    tag: "1.0.48"
  # This 2-node cluster is already at 96-99% CPU *requests* (Dsv7 quota is
  # maxed, no room for a 3rd node) — 2 replicas here plus Argo CD's own
  # overhead doesn't fit. 1 replica is enough for a dev/demo environment.
  autoscaling:
    minReplicas: 1
frontend:
  image:
    tag: "1.0.48"
  razorpayKeyId: "rzp_test_TOpPJJoN5F2yHB"
  autoscaling:
    minReplicas: 1
secrets:
  azure:
    keyvaultName: "shopnest-dev-kv2"
# Only changes when Terraform recreates the backend identity (rare) — safe
# to commit directly (it's an identifier, not a secret) rather than relying
# on a live `--set` at deploy time, which Argo CD's GitOps flow has no
# equivalent for.
workloadIdentity:
  clientId: "15b4f024-bc6f-4211-9fda-d592a7737c1a"
ingress:
  # Retesting whether the earlier "Free Trial blocks all inbound LB
  # traffic" conclusion actually holds, or was specific to that session —
  # no documented Azure policy says Free Trial blocks this universally.
  # ingress-nginx's LoadBalancer external IP, via the free nip.io wildcard
  # DNS trick (no real domain owned yet). TLS left off for this retest to
  # keep cert-manager out of the loop while just checking raw reachability.
  host: "20.79.75.216.nip.io"
  tls:
    enabled: false
