backend:
  image:
    tag: "1.0.51"
  # This 2-node cluster is already at 96-99% CPU *requests* (Dsv7 quota is
  # maxed, no room for a 3rd node) — 2 replicas here plus Argo CD's own
  # overhead doesn't fit. 1 replica is enough for a dev/demo environment.
  autoscaling:
    minReplicas: 1
frontend:
  image:
    tag: "1.0.51"
  razorpayKeyId: "rzp_test_TOpPJJoN5F2yHB"
  autoscaling:
    minReplicas: 1
secrets:
  azure:
    keyvaultName: "shopnest-dev-kv2"
# Only changes when Terraform recreates the backend identity (rare) — safe
# to commit directly (it's an identifier, not a secret) rather than relying
# on a live `--set` at deploy time, which Argo CD's GitOps flow has no
# equivalent for.
workloadIdentity:
  clientId: "fb1581b1-15aa-463b-ac44-54cc10f42359"
ingress:
  # ingress-nginx isn't installed this round — the Free Trial subscription's
  # inbound restriction is confirmed real (repeated across two independent
  # fresh IPs and a full rebuild), so a public LoadBalancer here would just
  # burn cost for no reachability. Access is via a Cloudflare Tunnel
  # (outbound-only, sidesteps the restriction entirely) instead.
  host: ""
  tls:
    enabled: false
