backend:
  image:
    tag: "1.0.5"
  # This 2-node cluster is already at 96-99% CPU *requests* (Dsv7 quota is
  # maxed, no room for a 3rd node) — 2 replicas here plus Argo CD's own
  # overhead doesn't fit. 1 replica is enough for a dev/demo environment.
  autoscaling:
    minReplicas: 1
frontend:
  image:
    tag: "1.0.5"
  razorpayKeyId: "rzp_test_TOpPJJoN5F2yHB"
  autoscaling:
    minReplicas: 1
secrets:
  azure:
    keyvaultName: "shopnest-dev-kv2026"
# Only changes when Terraform recreates the backend identity (rare) — safe
# to commit directly (it's an identifier, not a secret) rather than relying
# on a live `--set` at deploy time, which Argo CD's GitOps flow has no
# equivalent for.
workloadIdentity:
  clientId: "3beeff69-98f3-43f1-95ed-28067bff16bd"
ingress:
  # ingress-nginx's LoadBalancer (48.203.37.136) is directly reachable —
  # the earlier "Free Trial blocks inbound" diagnosis was wrong; the real
  # cause was the subnet NSG's DenyInternetInbound rule swallowing Azure's
  # LB health-probe traffic before it could be allowed. Fixed at the NSG
  # layer (see terraform/azure/modules/networking), no tunnel needed.
  host: ""
  tls:
    enabled: false
