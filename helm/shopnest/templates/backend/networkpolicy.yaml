# Ingress-only outbound-wise, same reasoning as the NSG egress rules in
# Terraform: this app talks to several external SaaS APIs (Mongo, Cloudinary,
# Razorpay, Gmail) on a variety of hosts/ports that a NetworkPolicy can't
# express any more precisely than an NSG service-tag list can — restricting
# egress risks the same kind of breakage that was found and reverted at the
# NSG layer. Egress is intentionally left unrestricted.
#
# Inbound IS scoped, unlike egress: the only legitimate source is the
# ingress-nginx controller (Internet -> LB -> ingress-nginx pod -> this
# Service), so `from` is restricted to the ingress-nginx namespace via its
# automatic `kubernetes.io/metadata.name` label — no other pod in the
# cluster can reach this port directly anymore.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shopnest-backend
  labels:
    app.kubernetes.io/name: shopnest-backend
    app.kubernetes.io/part-of: shopnest
    app.kubernetes.io/component: backend
spec:
  podSelector:
    matchLabels:
      app: shopnest-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
