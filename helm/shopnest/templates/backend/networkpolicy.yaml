# Ingress-only outbound-wise, same reasoning as the NSG egress rules in
# Terraform: this app talks to several external SaaS APIs (Mongo, Cloudinary,
# Razorpay, Gmail) on a variety of hosts/ports that a NetworkPolicy can't
# express any more precisely than an NSG service-tag list can — restricting
# egress risks the same kind of breakage that was found and reverted at the
# NSG layer. Egress is intentionally left unrestricted.
#
# Inbound IS scoped, unlike egress. Two legitimate sources:
# 1. the ingress-nginx controller (Internet -> LB -> ingress-nginx pod ->
#    this Service), via the ingress-nginx namespace's automatic
#    `kubernetes.io/metadata.name` label.
# 2. the frontend pod, same-namespace — frontend/nginx.conf's own `/api/`
#    location reverse-proxies directly to `backend:5000` (used when the
#    frontend Service is reached without going through the Ingress), so it
#    needs the same access the Ingress path already has.
# No other pod in the cluster can reach this port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shopnest-backend
  labels:
    app.kubernetes.io/name: shopnest-backend
    app.kubernetes.io/part-of: shopnest
    app.kubernetes.io/component: backend
spec:
  podSelector:
    matchLabels:
      app: shopnest-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app: shopnest-frontend
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
