{{- if .Values.workloadIdentity.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.workloadIdentity.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shopnest.labels" (dict "component" "backend") | nindent 4 }}
  {{- if eq .Values.cloud.provider "azure" }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.clientId | quote }}
  {{- end }}
  {{- /* AWS: no annotation. EKS Pod Identity binds this service account to
         its role through an association on the cluster (terraform eks
         module), not through the ServiceAccount itself. */}}
{{- end }}