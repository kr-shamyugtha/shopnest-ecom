{{- if .Values.secrets.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secrets.providerClassName }}
  labels:
    {{- include "shopnest.labels" (dict "component" "backend") | nindent 4 }}

spec:
  provider: {{ .Values.cloud.provider }}

  secretObjects:
    - secretName: {{ .Values.secrets.k8sSecretName }}
      type: Opaque
      data:
        {{- range .Values.secrets.items }}
        - objectName: {{ .name }}
          key: {{ .key }}
        {{- end }}

  parameters:
    {{- if eq .Values.cloud.provider "aws" }}
    # Secrets Manager names are <secretPrefix>/<name>; objectAlias keeps the
    # mounted file (and so the secretObjects key above) the bare name, the
    # same as the Key Vault branch. Pod Identity, not IRSA: the AWS Free plan
    # can't create the IAM OIDC provider IRSA depends on.
    region: {{ required "secrets.aws.region is required on AWS" .Values.secrets.aws.region | quote }}
    usePodIdentity: "true"
    objects: |
      {{- range .Values.secrets.items }}
      - objectName: {{ printf "%s/%s" $.Values.secrets.aws.secretPrefix .name | quote }}
        objectType: secretsmanager
        objectAlias: {{ .name | quote }}
      {{- end }}
    {{- else }}
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "{{ .Values.workloadIdentity.clientId }}"
    keyvaultName: "{{ .Values.secrets.azure.keyvaultName }}"
    tenantId: "{{ .Values.secrets.azure.tenantId }}"

    objects: |
      array:
        {{- range .Values.secrets.items }}
        - |
          objectName: {{ .name }}
          objectType: secret
        {{- end }}
    {{- end }}
{{- end }}
