apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopnest-backend
  labels:
    app: shopnest-backend
    app.kubernetes.io/name: shopnest-backend
    app.kubernetes.io/part-of: shopnest
    app.kubernetes.io/component: backend

spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: shopnest-backend

  template:
    metadata:
      labels:
        app: shopnest-backend
        app.kubernetes.io/name: shopnest-backend
        app.kubernetes.io/part-of: shopnest
        app.kubernetes.io/component: backend
        azure.workload.identity/use: "true"
      annotations:
        checksum/config: {{ include (printf "%s/configmap.yaml" (dir .Template.Name)) . | sha256sum }}

    spec:
      {{- if .Values.workloadIdentity.enabled }}
      serviceAccountName: {{ .Values.workloadIdentity.serviceAccountName }}
      {{- end }}
      # Neither container calls the Kubernetes API directly (Key Vault access
      # goes through workload identity + the CSI driver, not kubectl-style
      # calls), so there's no reason to auto-mount an API token.
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: shopnest-backend

      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - containerPort: {{ .Values.backend.port }}

          envFrom:
            {{- if .Values.secrets.enabled }}
            - secretRef:
                name: {{ .Values.secrets.k8sSecretName }}
            {{- end }}

            - configMapRef:
                name: shopnest-backend-config

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: uploads
              mountPath: /app/uploads
            {{- if .Values.secrets.enabled }}
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
            {{- end }}

          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: tmp
          emptyDir: {}
        - name: uploads
          emptyDir: {}
        {{- if .Values.secrets.enabled }}
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.secrets.providerClassName }}
        {{- end }}
