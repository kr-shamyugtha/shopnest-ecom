{{- if .Values.backend.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shopnest-backend
  labels:
    {{- include "shopnest.labels" (dict "component" "backend") | nindent 4 }}
spec:
  minAvailable: {{ .Values.backend.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "shopnest.selectorLabels" (dict "component" "backend") | nindent 6 }}
{{- end }}
