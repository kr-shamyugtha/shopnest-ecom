apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopnest-frontend
  labels:
    app: shopnest-frontend
    app.kubernetes.io/name: shopnest-frontend
    app.kubernetes.io/part-of: shopnest
    app.kubernetes.io/component: frontend

spec:
  {{- if not .Values.frontend.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicas }}
  {{- end }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Same reasoning as the backend Deployment — see its comment.
      maxSurge: 0
      maxUnavailable: 1

  selector:
    matchLabels:
      app: shopnest-frontend

  template:
    metadata:
      labels:
        app: shopnest-frontend
        app.kubernetes.io/name: shopnest-frontend
        app.kubernetes.io/part-of: shopnest
        app.kubernetes.io/component: frontend
      annotations:
        checksum/config: {{ include (printf "%s/configmap.yaml" (dir .Template.Name)) . | sha256sum }}

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        # The nginx image's USER directive is a named user (nginx), not a
        # numeric UID — kubelet can't verify that resolves to non-root
        # without a numeric hint, and refuses to start the container at all
        # (CreateContainerConfigError) without these two explicit values.
        # 101/101 is the nginx:alpine image's actual built-in uid/gid.
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: shopnest-frontend

      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - containerPort: {{ .Values.frontend.port }}

          volumeMounts:
            - name: frontend-runtime-config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp

          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: frontend-runtime-config
          configMap:
            name: shopnest-frontend-config
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
