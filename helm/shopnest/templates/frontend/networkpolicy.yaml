# Ingress-only — see backend/networkpolicy.yaml for why egress isn't
# restricted here either.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shopnest-frontend
  labels:
    app.kubernetes.io/name: shopnest-frontend
    app.kubernetes.io/part-of: shopnest
    app.kubernetes.io/component: frontend
spec:
  podSelector:
    matchLabels:
      app: shopnest-frontend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.frontend.port }}
