# See backend/networkpolicy.yaml for why egress isn't restricted, and why
# ingress is scoped to the ingress-nginx namespace specifically.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shopnest-frontend
  labels:
    {{- include "shopnest.labels" (dict "component" "frontend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "shopnest.selectorLabels" (dict "component" "frontend") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.port }}
