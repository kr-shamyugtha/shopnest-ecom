# See backend/networkpolicy.yaml for why egress isn't restricted, and why
# ingress is scoped to the ingress-nginx namespace specifically.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shopnest-frontend
  labels:
    app.kubernetes.io/name: shopnest-frontend
    app.kubernetes.io/part-of: shopnest
    app.kubernetes.io/component: frontend
spec:
  podSelector:
    matchLabels:
      app: shopnest-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.port }}
