# ============================================================
# Checkov — static analysis for the Terraform in terraform/azure.
#
# Closes the last gap in the scanning layers: SonarCloud reads the
# application code, Trivy reads the built images, and until this file
# nothing read the infrastructure definitions. A misconfigured NSG or a
# publicly-writable storage account would have reached Azure unexamined.
#
# Run locally exactly as CI does:
#   docker run --rm -v "$PWD":/tf:ro bridgecrew/checkov:latest \
#     --config-file /tf/.checkov.yaml -d /tf/terraform/azure
#
# ---- On the skip list below -------------------------------------------
# Every entry is a DOCUMENTED, accepted trade-off, not silence. Checkov
# skips are per-check-ID, not per-file, so the gate still fails on any
# new class of misconfiguration in any resource added later — which is
# the point. Nothing here is skipped because it was inconvenient; each
# one names what it would actually cost to fix.
#
# Re-evaluate this list when any of these change:
#   * ACR moves off the Basic SKU
#   * the environment stops being a single trial-credit dev cluster
#   * private endpoints / private DNS zones are introduced
# ============================================================

directory:
  - terraform/azure

framework:
  - terraform

# Fail the build. This is a gate, not a report.
soft-fail: false

compact: true

skip-check:
  # ----------------------------------------------------------
  # A. Require the ACR Premium SKU. This registry is Basic
  #    (shopnestacr2026) — a deliberate cost choice on trial
  #    credit. None of these are configurable at Basic; they are
  #    blocked by billing, not by oversight.
  # ----------------------------------------------------------
  - CKV_AZURE_139 # ACR disable public networking — needs Premium + private endpoint
  - CKV_AZURE_163 # ACR vulnerability scanning — Defender for Containers, Premium
  - CKV_AZURE_164 # ACR signed/trusted images — content trust, Premium
  - CKV_AZURE_165 # ACR geo-replication — Premium; also single-region by design
  - CKV_AZURE_166 # ACR image quarantine — Premium
  - CKV_AZURE_167 # ACR untagged-manifest retention policy — Premium
  - CKV_AZURE_233 # ACR zone redundancy — Premium
  - CKV_AZURE_237 # ACR dedicated data endpoints — Premium
  # Image vulnerability scanning is NOT actually absent despite
  # CKV_AZURE_163 — Trivy gates every image in ci/azure-pipelines.yml
  # before it is pushed, which covers the same intent outside the
  # registry. See the SecurityScan stage.

  # ----------------------------------------------------------
  # B. Require private endpoints + private DNS zones. Adopting
  #    these would make the control plane and the state backend
  #    unreachable from Azure DevOps Microsoft-hosted agents,
  #    whose egress IPs are dynamic, and from local admin access.
  #    That is a network redesign, not a flag.
  # ----------------------------------------------------------
  - CKV_AZURE_109 # Key Vault firewall rules
  - CKV_AZURE_189 # Key Vault disable public network access
  - CKV2_AZURE_32 # Key Vault private endpoint
  - CKV2_AZURE_33 # tfstate storage account private endpoint
  - CKV_AZURE_59 # tfstate storage account public network access
  - CKV_AZURE_115 # AKS private cluster
  - CKV_AZURE_6 # AKS API server authorized IP ranges — hosted agents have no stable IP
  # Note: the storage account is already hardened at the data layer —
  # allow_nested_items_to_be_public=false, shared_access_key_enabled=false,
  # Entra-only auth, TLS 1.2 minimum. These checks are about the NETWORK
  # perimeter specifically.

  # ----------------------------------------------------------
  # C. Deliberate capacity and cost decisions on a 2-node dev
  #    cluster that is already at ~99% CPU requests, several of
  #    which are explained in the code itself.
  # ----------------------------------------------------------
  - CKV_AZURE_4 # AKS → Azure Monitor. Removed on purpose: ama-logs + ama-metrics
  #                measured ~946m CPU requests, a quarter of this cluster.
  #                Replaced by self-hosted kube-prometheus-stack + Loki.
  #                See the comment in modules/aks/main.tf.
  - CKV_AZURE_170 # Paid AKS SKU for the API server SLA — Free tier on trial credit
  - CKV_AZURE_232 # only_critical_addons_enabled. This would taint the sole system
  #                node pool and evict the application pods; there is no separate
  #                user node pool to move them to.
  - CKV_AZURE_168 # ≥50 max_pods per node — changing forces node pool replacement
  - CKV_AZURE_226 # ephemeral OS disks — forces node pool replacement
  - CKV_AZURE_227 # host encryption — needs the EncryptionAtHost subscription
  #                feature and forces node pool replacement
  - CKV_AZURE_117 # AKS disk encryption set — needs a DES plus a Key Vault key
  - CKV_AZURE_171 # AKS automatic upgrade channel — left manual while the cluster
  #                has zero CPU headroom; an unattended upgrade with no room to
  #                surge is how you lose the cluster
  - CKV_AZURE_206 # tfstate storage GRS/ZRS replication — LRS on trial credit
  - CKV2_AZURE_1 # Customer-managed key encryption for the state storage account
  - CKV_AZURE_33 # Storage queue logging — this account serves blob state only,
  #                no queues exist
  - CKV2_AZURE_21 # Blob read logging — needs a Log Analytics workspace, removed
  #                alongside CKV_AZURE_4 above

  # ----------------------------------------------------------
  # D. Not applicable to this repository.
  # ----------------------------------------------------------
  - CKV_AZURE_249 # "GitHub Actions OIDC trust policy configured securely" — checks
  #                for wildcard subjects in GitHub federations. The federated
  #                credentials in modules/ci-identity are AZURE DEVOPS service
  #                connections, and their subjects are exact service-endpoint IDs
  #                with no wildcard. False positive for this setup.
  - CKV_AZURE_160 # "HTTP (port 80) restricted from the internet" — the NSG rule is
  #                what lets ingress-nginx serve at all. dev has no DNS name, so
  #                Let's Encrypt cannot issue a certificate and TLS is off; the
  #                Ingress template already wires cert-manager behind
  #                ingress.tls.enabled for environments that do have a hostname.
