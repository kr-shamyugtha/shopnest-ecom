sonar.projectKey=ShopNest1
sonar.projectName=ShopNest1
sonar.projectVersion=1.0
sonar.sources=backend,frontend/src
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/coverage/**,**/seed.js,**/*.test.js,backend/tests/**
sonar.sourceEncoding=UTF-8

# Test files are indexed as tests, not as untested source code. They must
# also be listed in sonar.exclusions above, since a file can't be both.
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=**/*.test.js

# Written by the Test stage and downloaded into the checkout before analysis.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
