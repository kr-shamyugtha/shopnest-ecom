# path is set in atlantis.service, which can refer to the home directory.
atlantis-url: https://quarrel-skydiver-outsource.ngrok-free.dev
port: 4141

azuredevops-user: kavitography@gmail.com
azuredevops-webhook-user: atlantis

repo-allowlist: dev.azure.com/kavitography/shopnest-ado/shopnest-ado,kavitography.visualstudio.com/kavitography/shopnest-ado/shopnest-ado

