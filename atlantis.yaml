version: 3

# Only the dev units are registered. Staging/prod have never been applied
# and shared holds the ACR and the CI identity. Widen this deliberately,
# once it's settled which Azure credential the Atlantis server runs with
# and what that credential should be allowed to touch.
#
# Apply requirements are deliberately not set here. Atlantis reads this
# file from the PR's own branch, so a rule defined here could be removed by
# the very PR it's meant to gate. They're set in the server-side repos.yaml
# instead, which a PR can't override.
projects:
  - name: dev-resource-group
    dir: terraform/azure/live/dev/germanywestcentral/resource-group
    workflow: terragrunt
    autoplan:
      when_modified:
        - "*.hcl"
        - "../../../../modules/resource-group/**/*.tf"

  - name: dev-networking
    dir: terraform/azure/live/dev/germanywestcentral/networking
    workflow: terragrunt
    autoplan:
      when_modified:
        - "*.hcl"
        - "../../../../modules/networking/**/*.tf"

  - name: dev-aks
    dir: terraform/azure/live/dev/germanywestcentral/aks
    workflow: terragrunt
    autoplan:
      when_modified:
        - "*.hcl"
        - "../../../../modules/aks/**/*.tf"
        - "../../../../modules/workload-identity/**/*.tf"

  - name: dev-keyvault
    dir: terraform/azure/live/dev/germanywestcentral/keyvault
    workflow: terragrunt
    autoplan:
      when_modified:
        - "*.hcl"
        - "../../../../modules/keyvault/**/*.tf"

  - name: dev-cert-manager
    dir: terraform/azure/live/dev/germanywestcentral/cert-manager
    workflow: terragrunt
    autoplan:
      when_modified:
        - "*.hcl"
        - "../../../../modules/cert-manager/**/*.tf"

  - name: dev-ingress-nginx
    dir: terraform/azure/live/dev/germanywestcentral/ingress-nginx
    workflow: terragrunt
    autoplan:
      when_modified:
        - "*.hcl"
        - "../../../../modules/ingress-nginx/**/*.tf"

# Native Atlantis assumes plain `terraform`, but this repo is Terragrunt —
# every project above uses this instead. Both `terragrunt` and `terraform`
# must be on the Atlantis server's PATH; terragrunt shells out to terraform.
workflows:
  terragrunt:
    plan:
      steps:
        - run: terragrunt plan -no-color -out $PLANFILE
    apply:
      steps:
        - run: terragrunt apply -no-color $PLANFILE
