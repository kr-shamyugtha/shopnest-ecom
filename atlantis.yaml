version: 3
automerge: false

# This repo uses Terragrunt, not plain Terraform — the "terragrunt" workflow
# below shells out to terragrunt instead of terraform directly. Every
# project uses it. Projects are listed explicitly rather than relying on
# autodiscovery, since Terragrunt units reference a remote module source
# (no local .tf files to detect) — autodiscovery can't reliably find them.

projects:
  # --- shared ---
  - name: shared-resource-group
    dir: terraform/azure/live/shared/germanywestcentral/resource-group
    workflow: terragrunt
  - name: shared-acr
    dir: terraform/azure/live/shared/germanywestcentral/acr
    workflow: terragrunt

  # --- dev (the only environment actually applied) ---
  - name: dev-resource-group
    dir: terraform/azure/live/dev/germanywestcentral/resource-group
    workflow: terragrunt
  - name: dev-networking
    dir: terraform/azure/live/dev/germanywestcentral/networking
    workflow: terragrunt
  - name: dev-aks
    dir: terraform/azure/live/dev/germanywestcentral/aks
    workflow: terragrunt
  - name: dev-keyvault
    dir: terraform/azure/live/dev/germanywestcentral/keyvault
    workflow: terragrunt
  - name: dev-ingress-nginx
    dir: terraform/azure/live/dev/germanywestcentral/ingress-nginx
    workflow: terragrunt
  - name: dev-cert-manager
    dir: terraform/azure/live/dev/germanywestcentral/cert-manager
    workflow: terragrunt

  # --- staging (IaC-complete, never applied — plan-only in practice) ---
  - name: staging-resource-group
    dir: terraform/azure/live/staging/westeurope/resource-group
    workflow: terragrunt
  - name: staging-networking
    dir: terraform/azure/live/staging/westeurope/networking
    workflow: terragrunt
  - name: staging-aks
    dir: terraform/azure/live/staging/westeurope/aks
    workflow: terragrunt
  - name: staging-keyvault
    dir: terraform/azure/live/staging/westeurope/keyvault
    workflow: terragrunt
  - name: staging-ingress-nginx
    dir: terraform/azure/live/staging/westeurope/ingress-nginx
    workflow: terragrunt
  - name: staging-cert-manager
    dir: terraform/azure/live/staging/westeurope/cert-manager
    workflow: terragrunt

  # --- prod (IaC-complete, never applied — plan-only in practice) ---
  - name: prod-resource-group
    dir: terraform/azure/live/prod/eastus/resource-group
    workflow: terragrunt
  - name: prod-networking
    dir: terraform/azure/live/prod/eastus/networking
    workflow: terragrunt
  - name: prod-aks
    dir: terraform/azure/live/prod/eastus/aks
    workflow: terragrunt
  - name: prod-keyvault
    dir: terraform/azure/live/prod/eastus/keyvault
    workflow: terragrunt
  - name: prod-ingress-nginx
    dir: terraform/azure/live/prod/eastus/ingress-nginx
    workflow: terragrunt
  - name: prod-cert-manager
    dir: terraform/azure/live/prod/eastus/cert-manager
    workflow: terragrunt

workflows:
  terragrunt:
    plan:
      steps:
        - run: terragrunt plan -no-color -out $PLANFILE
    apply:
      steps:
        - run: terragrunt apply -no-color $PLANFILE
