version: 3

# Only the dev units are registered — Atlantis's Azure identity is
# dev-scoped only (see terraform/azure/modules/atlantis-identity). Adding
# staging/prod/shared here now would just produce failed-plan comments on
# unrelated PRs, since there's no credential that can touch those resource
# groups yet. Add them once each environment has its own identity (or its
# own Atlantis instance).
projects:
  - name: dev-resource-group
    dir: terraform/azure/live/dev/germanywestcentral/resource-group
    workflow: terragrunt
    apply_requirements: [approved]
    autoplan:
      when_modified:
        - "*.hcl"
        - "../../../../modules/resource-group/**/*.tf"

  - name: dev-networking
    dir: terraform/azure/live/dev/germanywestcentral/networking
    workflow: terragrunt
    apply_requirements: [approved]
    autoplan:
      when_modified:
        - "*.hcl"
        - "../../../../modules/networking/**/*.tf"

  - name: dev-aks
    dir: terraform/azure/live/dev/germanywestcentral/aks
    workflow: terragrunt
    apply_requirements: [approved]
    autoplan:
      when_modified:
        - "*.hcl"
        - "../../../../modules/aks/**/*.tf"
        - "../../../../modules/workload-identity/**/*.tf"

  - name: dev-keyvault
    dir: terraform/azure/live/dev/germanywestcentral/keyvault
    workflow: terragrunt
    apply_requirements: [approved]
    autoplan:
      when_modified:
        - "*.hcl"
        - "../../../../modules/keyvault/**/*.tf"

  - name: dev-cert-manager
    dir: terraform/azure/live/dev/germanywestcentral/cert-manager
    workflow: terragrunt
    apply_requirements: [approved]
    autoplan:
      when_modified:
        - "*.hcl"
        - "../../../../modules/cert-manager/**/*.tf"

  - name: dev-ingress-nginx
    dir: terraform/azure/live/dev/germanywestcentral/ingress-nginx
    workflow: terragrunt
    apply_requirements: [approved]
    autoplan:
      when_modified:
        - "*.hcl"
        - "../../../../modules/ingress-nginx/**/*.tf"

# dev-atlantis-identity is deliberately NOT registered here. It manages the
# permissions of the identity Atlantis itself plans as — confirmed live: it
# can authenticate fine, but can't even read its own existing role
# assignment in shopnest-tfstate-rg (Storage Blob Data Contributor doesn't
# include roleAssignments/read). Granting more permission to fix that isn't
# the right move: an identity that could grant itself new role assignments
# via a merged PR would be a privilege-escalation path. This one project
# stays human-applied, always — see the ordered `terragrunt apply` steps
# used to set it up.

# Native Atlantis assumes plain `terraform`, but this repo is Terragrunt —
# every project above uses this instead. The bundled (non-slim) Atlantis
# image already includes a terraform binary on PATH; terragrunt (added via
# an initContainer, see argocd/values-atlantis.yaml) just calls it.
workflows:
  terragrunt:
    plan:
      steps:
        - run: terragrunt plan -no-color -out $PLANFILE
    apply:
      steps:
        - run: terragrunt apply -no-color $PLANFILE
